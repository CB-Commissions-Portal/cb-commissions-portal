<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CB Production Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --font-main: -apple-system, 'SF Pro Display', 'Plus Jakarta Sans', 'Helvetica Neue', Arial, sans-serif; }
</style>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-main);background:#161c2a;color:#e8eef8;font-size:13px;min-height:100vh}
input,select,textarea,button{font-family:var(--font-main)}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:#161b22}
::-webkit-scrollbar-thumb{background:#30363d;border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:#484f58}
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f5f7fa}
.auth-card{background:#ffffff;border:1px solid #dde3ed;border-radius:12px;padding:36px 32px;width:400px;max-width:92vw;box-shadow:0 4px 24px rgba(0,0,0,.08)}
.auth-brand{font-size:10px;font-weight:600;letter-spacing:2px;color:#7a8ba0;text-transform:uppercase;margin-bottom:8px}
.auth-title{font-size:22px;font-weight:700;color:#111827;margin-bottom:4px}
.auth-sub{font-size:12px;color:#6b7280;margin-bottom:24px}
.auth-label{display:block;font-size:11px;font-weight:600;color:#9aaabe;margin-bottom:5px;text-transform:uppercase;letter-spacing:.5px}
.auth-inp{width:100%;background:#f9fafb;border:1px solid #d1d5db;color:#111827;padding:9px 12px;border-radius:7px;font-size:14px;margin-bottom:14px;transition:border .15s}
.auth-inp:focus{outline:none;border-color:#1a3a6a;background:#fff}
.auth-btn{width:100%;padding:10px;background:#1a3a6a;color:#fff;border:none;border-radius:7px;font-size:14px;font-weight:600;cursor:pointer;transition:background .15s;margin-top:4px}
.auth-btn:hover{background:#1e4d8c}
.auth-btn:disabled{opacity:.5;cursor:not-allowed}
.auth-err{background:#fef2f2;border:1px solid #fca5a5;color:#dc2626;padding:9px 12px;border-radius:7px;font-size:12px;margin-bottom:14px}
.auth-note{font-size:11px;color:#9ca3af;text-align:center;margin-top:14px}
.app{display:flex;flex-direction:column;height:100vh;overflow:hidden;background:#161c2a}
.topbar{background:#1e2535;border-bottom:1px solid #2e3a50;height:52px;display:flex;align-items:center;padding:0 20px;gap:14px;flex-shrink:0}
.logo{font-size:15px;font-weight:800;color:#58a6ff;letter-spacing:.5px}
.logo-sep{color:#30363d;font-size:16px;margin:0 2px}
.logo-sub{font-size:13px;color:#7a8ba0;font-weight:500}
.sync-pill{display:flex;align-items:center;gap:5px;font-size:11px;color:#6e7681;margin-left:6px}
.sync-dot{width:6px;height:6px;border-radius:50%}
.sync-dot.live{background:#3fb950;box-shadow:0 0 5px #3fb950;animation:blink 2s infinite}
.sync-dot.saving{background:#d29922;animation:blink .5s infinite}
.sync-dot.offline{background:#f85149}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
.user-area{margin-left:auto;display:flex;align-items:center;gap:8px}
.user-chip{display:flex;align-items:center;gap:7px;background:#252d3d;border:1px solid #2e3a50;border-radius:20px;padding:4px 12px 4px 5px}
.avatar{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;flex-shrink:0}
.u-name{font-size:13px;font-weight:600;color:#eaf0ff}
.u-role-lbl{font-size:11px;font-weight:600}
.sign-out{background:none;border:1px solid #30363d;color:#6e7681;padding:4px 10px;border-radius:6px;cursor:pointer;font-size:11px;transition:all .15s}
.sign-out:hover{border-color:#f85149;color:#f85149}
.ticker{background:#1e2535;border-bottom:1px solid #2e3a50;padding:10px 20px;display:flex;align-items:center;flex-shrink:0;gap:0}
.t-item{display:flex;flex-direction:column;align-items:center;padding:0 28px;border-right:1px solid #252d3d}
.t-item:first-child{padding-left:0}
.t-item:last-child{border-right:none}
.t-lbl{font-size:10px;font-weight:600;color:#7a8ba0;text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}
.t-val{font-size:26px;font-weight:800;font-family:'JetBrains Mono',monospace;line-height:1}
.t-val.c{color:#58a6ff}
.t-val.p{color:#3fb950}
.t-val.r{color:#d29922}
.t-inp{background:#252d3d;border:1px solid #30363d;color:#58a6ff;font-family:'JetBrains Mono',monospace;font-size:20px;font-weight:700;width:72px;padding:1px 6px;border-radius:5px;text-align:center}
.t-sep{font-size:20px;color:#30363d;padding:0 6px;align-self:center}
.t-meta{padding-left:18px;margin-left:14px;border-left:1px solid #21262d;font-size:11px;color:#6e7681;display:flex;flex-direction:column;gap:4px}
.t-ready{color:#3fb950;font-weight:600}
.tabs{display:flex;background:#1e2535;border-bottom:1px solid #30363d;padding:0 16px;flex-shrink:0}
.tab-btn{padding:9px 16px;font-size:12px;font-weight:600;color:#6e7681;cursor:pointer;border-bottom:2px solid transparent;transition:all .15s;text-transform:uppercase;letter-spacing:.3px}
.tab-btn.active{color:#58a6ff;border-bottom-color:#388bfd}
.tab-btn:hover:not(.active){color:#8b949e}
.content{flex:1;overflow:hidden;display:flex;flex-direction:column;min-height:0;max-height:calc(100vh - 90px)}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 16px;background:#1e2535;border-bottom:1px solid #30363d;flex-shrink:0}
.s-inp{background:#252d3d;border:1px solid #2e3a50;color:#e8eef8;padding:8px 12px;border-radius:7px;font-size:13px;width:210px;transition:border .15s}
.s-inp:focus{outline:none;border-color:#388bfd}
.f-sel{background:#252d3d;border:1px solid #2e3a50;color:#9aaabe;padding:8px 12px;border-radius:7px;font-size:13px;cursor:pointer}
.btn{padding:8px 16px;border-radius:7px;border:1px solid #2e3a50;background:#252d3d;color:#9aaabe;cursor:pointer;font-size:13px;font-weight:600;transition:all .15s;white-space:nowrap}
.btn:hover{background:#30363d;color:#e6edf3}
.btn.primary{background:#1f4023;color:#3fb950;border-color:#2d6a2d}
.btn.primary:hover{background:#2d6a2d}
.btn.danger{background:#3d1c1c;color:#f85149;border-color:#6e3535}
.count-lbl{margin-left:auto;font-size:11px;color:#6e7681}
/* TABLE */
.table-outer{flex:1;overflow:auto;padding:12px 16px}
table{width:max-content;min-width:100%;border-collapse:collapse;table-layout:fixed}
thead{position:sticky;top:0;z-index:11}
th{background:#1e2535;color:#7a8ba0;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;padding:11px 12px;text-align:left;white-space:nowrap;cursor:pointer;border-bottom:2px solid #30363d;user-select:none}
th:hover{color:#8b949e}
td{padding:13px 12px;border-bottom:1px solid #252d3d;vertical-align:middle;white-space:nowrap}
tr:hover td{background:#1e2535}
/* Sticky first 4 columns */
.st{position:sticky;z-index:4;background:#161c2a}
th.st{background:#1e2535;z-index:12}
tr:hover td.st{background:#1e2535}
tr.paid-row td.st{background:#003d52}
tr.green-row td.st{background:#122a1a}
tr.yellow-row td.st{background:#2d2200!important}
tr.decom-row td.st{background:#2d0a0a!important}
.st-1{left:0px;width:36px;min-width:36px}
.st-2{left:36px;min-width:155px;max-width:155px}
.st-3{left:191px;width:160px;min-width:160px}
.st-4{left:351px}
td.st-4,th.st-4{border-right:2px solid #2e3a50;box-shadow:4px 0 8px rgba(0,0,0,.3)}
tr.paid-row td{background:#003d52!important}
tr.paid-row td .ci{color:#e0f8ff!important;background:transparent}
tr.paid-row td .ci:focus{background:#005570!important}
tr.paid-row{border-left:5px solid #00d4f0}
tr.paid-row:hover td{background:#004d66!important}
tr.paid-row .sc{background:#005570!important;color:#80f0ff!important;border-color:#00c8e0!important}
tr.paid-row .badge{border-color:rgba(0,212,240,.4)!important}
tr.green-row td{background:#122a1a}
tr.yellow-row td{background:#2d2200!important}
tr.yellow-row td.st{background:#2d2200!important}
tr.yellow-row td:first-child{border-left:5px solid #f5a623!important}
tr:hover.yellow-row td{background:#3a2d00!important}
tr:hover.yellow-row td.st{background:#3a2d00!important}
tr.yellow-row .ci{color:#ffe082!important}
tr.yellow-row .sc{background:#3a2d00!important;border-color:#f5a623!important;color:#ffe082!important}
tr.yellow-row .badge{border-color:rgba(245,166,35,.4)!important}
tr.decom-row td{background:#2d0a0a!important;opacity:1}
tr.decom-row td.st{background:#2d0a0a!important}
tr.decom-row td:first-child{border-left:5px solid #f85149!important}
tr:hover.decom-row td{background:#3d0f0f!important}
tr:hover.decom-row td.st{background:#3d0f0f!important}
tr.decom-row .ci{color:#ff9999!important;opacity:.7}
tr.decom-row .sc{background:#3d0f0f!important;border-color:#f85149!important;color:#ff9999!important}
.ci{background:transparent;border:1px solid transparent;color:#e8eef8;font-size:13px;padding:5px 8px;border-radius:5px;transition:border .15s,background .15s;font-family:var(--font-main);width:100%;box-sizing:border-box}
.ci:hover{border-color:#2e3a50;background:#1e2535}
.ci:focus{outline:none;background:#252d3d;border-color:#388bfd}
.ci:disabled{opacity:.35;cursor:not-allowed}
.ci::placeholder{color:#546070}
/* Attention highlight — empty field on assigned commission */
.ci.needs-attention{background:rgba(245,166,35,.08)!important;border-color:rgba(245,166,35,.4)!important}
.ci.needs-attention::placeholder{color:#f5a623!important;opacity:.8}
.ci.needs-attention:focus{background:#252d3d!important;border-color:#388bfd!important}
td.needs-attention-cb{background:rgba(245,166,35,.08)!important}
.ep-ci{font-size:12px;color:#e6edf3;background:transparent;border:1px solid transparent;padding:3px 6px;border-radius:4px;transition:all .15s;font-family:var(--font-main)}
.ep-ci:focus{outline:none;background:#21262d;border-color:#388bfd}
.ep-ci:hover{border-color:#30363d}
.sc{background:#252d3d;border:1px solid #30363d;color:#79c0ff;font-size:11px;font-weight:600;padding:4px 8px;border-radius:5px;font-family:'JetBrains Mono',monospace;width:130px;transition:border .15s}
.sc:focus{outline:none;border-color:#388bfd;background:#2a3347}
.sc:disabled{opacity:.4;cursor:not-allowed}
.sc.dup{border-color:#f85149;color:#f85149}
.dup-warn{color:#f85149;font-size:9px;display:block;margin-top:1px}
.cb{width:16px;height:16px;cursor:pointer;accent-color:#388bfd}
.cb.g{accent-color:#3fb950}
.ep-sel{background:#21262d;border:1px solid #30363d;color:#8b949e;padding:4px 7px;border-radius:5px;font-size:11px;width:90px}
.badge{display:inline-block;padding:4px 10px;border-radius:5px;font-size:11px;font-weight:700;white-space:nowrap}
.badge.paid{background:#102a4c;color:#79c0ff;border:1px solid #1f4b7a}
.badge.pending{background:#2d2000;color:#d29922;border:1px solid #4d3800}
.badge.decom{background:#2d0f2d;color:#bc8cff;border:1px solid #4d1f6d}
.badge.ih{background:#1c1c2d;color:#818cf8;border:1px solid #2d2d4d}
.decom-btn{padding:3px 9px;border-radius:4px;border:1px solid #30363d;background:transparent;color:#6e7681;cursor:pointer;font-size:10px;font-weight:600;transition:all .15s;white-space:nowrap}
.decom-btn:hover{border-color:#bc8cff;color:#bc8cff;background:#1a0a2a}
.decom-btn:disabled{opacity:.3;cursor:not-allowed}
.undo-btn{padding:3px 9px;border-radius:4px;border:1px solid #30363d;background:transparent;color:#6e7681;cursor:pointer;font-size:10px;font-weight:600;transition:all .15s}
.undo-btn:hover{border-color:#3fb950;color:#3fb950}
.add-row-btn{width:100%;padding:9px;border:1px dashed #30363d;border-radius:6px;background:transparent;color:#6e7681;cursor:pointer;font-size:12px;transition:all .2s;margin-top:10px}
.add-row-btn:hover{color:#8b949e;border-color:#484f58;background:#161b22}
/* EPISODES */
.ep-wrap{flex:1;overflow-y:auto;overflow-x:hidden;padding:14px 16px;min-height:0}
.info-box{background:#0d1b2a;border:1px solid #1f4b7a;border-radius:6px;padding:10px 14px;margin-bottom:12px;color:#79c0ff;font-size:12px}
.ep-card{background:#1e2535;border:1px solid #2e3a50;border-radius:10px;margin-bottom:14px;overflow:hidden}
.ep-head{background:#252d3d;padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.ep-num{background:#1f4023;color:#3fb950;font-size:13px;font-weight:800;padding:5px 12px;border-radius:5px;font-family:'JetBrains Mono',monospace}
.ep-date-btn{background:#252d3d;border:1px solid #2e3a50;color:#9aaabe;font-size:13px;padding:5px 10px;border-radius:5px;cursor:pointer;transition:all .15s}
.ep-date-btn:hover{border-color:#388bfd;color:#e6edf3}
.ep-date-inp{background:#252d3d;border:1px solid #388bfd;color:#e6edf3;font-size:12px;padding:3px 7px;border-radius:4px}
.ep-date-inp:focus{outline:none}
.type-toggle{margin-left:auto;display:flex;gap:3px}
.type-btn{padding:5px 12px;border-radius:5px;border:1px solid #2e3a50;background:transparent;color:#7a8ba0;cursor:pointer;font-size:12px;font-weight:600;transition:all .15s}
.type-btn.on.normal{background:#1f4023;color:#3fb950;border-color:#2d6a2d}
.type-btn.on.extended{background:#2d2000;color:#d29922;border-color:#4d3800}
.ep-body{padding:0;overflow-x:auto}
.ep-tbl{width:100%;min-width:900px;border-collapse:collapse;font-size:13px;table-layout:fixed}
.ep-tbl th{color:#7a8ba0;font-size:11px;font-weight:700;padding:10px 12px;text-align:left;border-bottom:2px solid #2e3a50;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ep-tbl td{padding:11px 12px;border-bottom:1px solid #252d3d;color:#b0bdd8;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ep-tbl tr:last-child td{border-bottom:none}
.ep-tbl td.story{color:#eaf0ff;font-weight:600;font-size:14px;white-space:normal}
.ep-tbl tr:hover td{background:rgba(255,255,255,.03)}
/* Fixed column widths for consistent alignment */
.ep-tbl th:nth-child(1),.ep-tbl td:nth-child(1){width:44px;text-align:center}.ep-tbl th:nth-child(2),.ep-tbl td:nth-child(2){width:28%}
.ep-tbl th:nth-child(3),.ep-tbl td:nth-child(3){width:10%;text-align:right}
.ep-tbl th:nth-child(5),.ep-tbl td:nth-child(5){width:18%;text-align:right}
.ep-tbl th:nth-child(5),.ep-tbl td:nth-child(5){width:18%;text-align:right}
.ep-tbl th:nth-child(6),.ep-tbl td:nth-child(6){width:16%;text-align:right}
.ep-tbl th:nth-child(7),.ep-tbl td:nth-child(7){width:10%;text-align:center}
.ep-foot{display:flex;gap:20px;padding:10px 16px;background:#141924;border-top:1px solid #252d3d;font-size:13px;flex-wrap:wrap}
.ep-stat{color:#6e7681}
.ep-stat b{font-weight:700}
.ep-stat b.bl{color:#58a6ff}
.ep-stat b.gr{color:#3fb950}
.ep-stat b.am{color:#d29922}
.dur{display:inline-block;padding:4px 8px;border-radius:4px;font-size:12px;font-weight:700;font-family:'JetBrains Mono',monospace;text-align:center;letter-spacing:.5px}
.dur.gr{background:#0d1f12;color:#3fb950}
.dur.am{background:#1f1500;color:#d29922}
.dur.bl{background:#0d1b2a;color:#58a6ff}
/* ADMIN */
.admin-wrap{flex:1;overflow:auto;padding:16px}
.admin-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.admin-card{background:#1e2535;border:1px solid #2e3a50;border-radius:8px;padding:18px}
.admin-card h4{font-size:11px;font-weight:700;color:#6e7681;margin-bottom:14px;text-transform:uppercase;letter-spacing:.5px}
.user-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #252d3d}
.user-row:last-of-type{border-bottom:none}
.u-av{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0}
.u-name{font-size:13px;font-weight:600;color:#e6edf3}
.u-email{font-size:10px;color:#6e7681}
.u-role-badge{font-size:9px;font-weight:700;padding:2px 8px;border-radius:3px}
.perm-row{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid #252d3d;align-items:flex-start}
.perm-row:last-child{border-bottom:none}
.perm-desc{font-size:11px;color:#8b949e;line-height:1.6}
/* MODALS */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:100;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(2px)}
.modal{background:#1e2535;border:1px solid #2e3a50;border-radius:10px;padding:24px;width:460px;max-width:90vw}
.modal h3{font-size:15px;font-weight:700;margin-bottom:6px;color:#e6edf3}
.modal p{color:#6e7681;font-size:12px;margin-bottom:10px;line-height:1.6}
.modal label{display:block;font-size:10px;font-weight:600;color:#6e7681;margin-bottom:4px;margin-top:12px;text-transform:uppercase;letter-spacing:.5px}
.modal input,.modal select,.modal textarea{width:100%;background:#141924;border:1px solid #30363d;color:#e6edf3;border-radius:6px;padding:8px 12px;font-size:13px;font-family:var(--font-main)}
.modal input:focus,.modal select:focus,.modal textarea:focus{outline:none;border-color:#388bfd}
.modal textarea{resize:vertical;min-height:80px}
.modal-actions{display:flex;gap:8px;margin-top:14px;justify-content:flex-end}
.modal-story{font-size:13px;color:#e6edf3;padding:4px 0;font-weight:500}
/* SETUP */
.setup-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0d1117;padding:24px}
.setup-inner{max-width:600px;width:100%}
.setup-title{font-size:24px;font-weight:700;margin-bottom:4px;color:#e6edf3;text-align:center}
.setup-sub{font-size:13px;color:#6e7681;text-align:center;margin-bottom:24px}
.setup-step{background:#1e2535;border:1px solid #2e3a50;border-radius:8px;padding:18px 20px;margin-bottom:10px}
.step-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.step-num{width:24px;height:24px;border-radius:50%;background:#1f4023;color:#3fb950;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.step-title{font-size:13px;font-weight:600;color:#e6edf3}
.step-body{font-size:12px;color:#8b949e;line-height:1.8;padding-left:34px}
.step-body code{background:#21262d;color:#79c0ff;padding:1px 6px;border-radius:3px;font-family:'JetBrains Mono',monospace;font-size:11px}
.step-body a{color:#58a6ff;text-decoration:none}
.cfg-fields{padding-left:34px;margin-top:10px}
.cfg-inp{width:100%;background:#141924;border:1px solid #30363d;color:#e6edf3;padding:8px 12px;border-radius:6px;font-size:12px;font-family:'JetBrains Mono',monospace;margin-bottom:6px;transition:border .15s}
.cfg-inp:focus{outline:none;border-color:#388bfd}
.cfg-inp::placeholder{color:#484f58}
.connect-btn{width:100%;padding:10px;background:#1f4023;color:#3fb950;border:1px solid #2d6a2d;border-radius:7px;font-size:13px;font-weight:600;cursor:pointer;margin-top:4px;font-family:'Inter',sans-serif;transition:all .15s}
.connect-btn:hover{background:#2d6a2d}
.connect-btn:disabled{opacity:.5;cursor:not-allowed}
.cfg-err{color:#f85149;font-size:12px;margin-top:6px;display:none}
/* TOAST */
.toast{position:fixed;bottom:20px;right:20px;background:#1f4023;border:1px solid #2d6a2d;color:#3fb950;padding:10px 16px;border-radius:8px;font-size:12px;font-weight:600;z-index:200;animation:fup .25s ease}
.toast.err{background:#3d1c1c;border-color:#6e3535;color:#f85149}
@keyframes fup{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@media print{
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body{background:#fff!important;color:#111!important;font-size:11px;font-family:-apple-system,'Helvetica Neue',Arial,sans-serif}
  .no-print{display:none!important}
  .app{height:auto!important;overflow:visible!important;display:block!important}
  .content{overflow:visible!important;display:block!important;height:auto!important}

function suggestCode(n){if(!n)return'';const stop=/^(the|and|for|from|with|into|a|an|of|in|at|to|or|by|down|up)$/i;const w=n.trim().split(/\s+/).filter(x=>x.length>1&&!stop.test(x));if(!w.length)return n.substring(0,5).toUpperCase();if(w.length===1)return w[0].substring(0,6).toUpperCase();if(w.length===2)return(w[0].substring(0,3)+w[1].substring(0,3)).toUpperCase();return w.slice(0,3).map(x=>x.substring(0,2)).join('').toUpperCase();}
function fmtHMS(v){
  // Accepts decimal minutes (e.g. 12.5) or HH:MM:SS / MM:SS strings
  if(v===''||v===null||v===undefined)return'—';
  const str=String(v).trim();
  // Already HH:MM:SS or MM:SS
  if(/^\d+:\d{2}(:\d{2})?$/.test(str)){
    const parts=str.split(':').map(Number);
    if(parts.length===3){
      const [h,m,s]=parts;
      return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    }
    if(parts.length===2){
      const [m,s]=parts;
      const h=Math.floor(m/60),rm=m%60;
      return `${String(h).padStart(2,'0')}:${String(rm).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    }
  }
  // Decimal minutes
  const n=parseFloat(str);
  if(isNaN(n))return str||'—';
  const totalSecs=Math.round(n*60);
  const h=Math.floor(totalSecs/3600);
  const m=Math.floor((totalSecs%3600)/60);
  const s=totalSecs%60;
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}
function fmtMins(v){return fmtHMS(v);} // alias for backward compat

function toDecimalMins(v){
  // Convert any duration format to decimal minutes for arithmetic
  if(v===''||v===null||v===undefined)return 0;
  const str=String(v).trim();
  if(/^\d+:\d{2}(:\d{2})?$/.test(str)){
    const parts=str.split(':').map(Number);
    if(parts.length===3)return parts[0]*60+parts[1]+parts[2]/60;
    if(parts.length===2)return parts[0]+parts[1]/60;
  }
  const n=parseFloat(str);
  return isNaN(n)?0:n;
}
function addDays(iso,d){const dt=new Date(iso+'T00:00:00');dt.setDate(dt.getDate()+d);return dt.toISOString().split('T')[0];}

function insertMinsDisplay(insertMins){
  // 34 minutes = 2040 seconds
  const allocatedSecs = 34 * 60;
  const totalSecs = Math.round(insertMins * 60);
  const diffSecs = totalSecs - allocatedSecs;
  const absSecs = Math.abs(diffSecs);
  const h = Math.floor(absSecs / 3600);
  const m = Math.floor((absSecs % 3600) / 60);
  const s = absSecs % 60;
  const diffStr = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  const mainStr = fmtHMS(insertMins);
  if(diffSecs > 0){
    // Over — RED with (+HH:MM:SS)
    return `<strong style="color:#f85149;font-family:'JetBrains Mono',monospace;font-size:13px">${mainStr} <span style="font-size:11px;opacity:.9">(+${diffStr})</span></strong>`;
  } else if(diffSecs < 0){
    // Under — GREEN with (-HH:MM:SS)
    return `<strong style="color:#3fb950;font-family:'JetBrains Mono',monospace;font-size:13px">${mainStr} <span style="font-size:11px;opacity:.9">(-${diffStr})</span></strong>`;
  } else {
    // Exact — GREEN, no bracket
    return `<strong style="color:#3fb950;font-family:'JetBrains Mono',monospace;font-size:13px">${mainStr}</strong>`;
  }
}
function fmtDate(iso){if(!iso)return'';return new Date(iso+'T00:00:00').toLocaleDateString('en-ZA',{weekday:'short',day:'2-digit',month:'short',year:'numeric'});}

function buildSlug(season,epNum,slugSuffix){

function getPromoTXDates(epDateStr,txType){
  const sun=new Date(epDateStr);
  const fmt=d=>d.toLocaleDateString('en-ZA',{day:'2-digit',month:'2-digit',year:'numeric'});
  const addDays=(d,n)=>{const r=new Date(d);r.setDate(r.getDate()+n);return r;};
  switch(txType){
    case'teaser':  return{from:fmt(addDays(sun,-12)),to:fmt(addDays(sun,-1))};
    case'after':   return{from:fmt(addDays(sun,1)), to:fmt(addDays(sun,6))};
    case'weekly':  return{from:fmt(addDays(sun,-6)),to:fmt(addDays(sun,-1))};
    case'tonight': return{from:fmt(sun),            to:fmt(sun)};
    case'catchup': return{from:fmt(addDays(sun,1)), to:fmt(addDays(sun,13))};
    default:       return{from:'',to:''};
  }
}

function exportPromoPDF(epNum){
  const n=epNum;
  const epDate=resolveDate(Number(n));
  const epStr=String(n).padStart(2,'0');
  const sunDate=new Date(epDate).toLocaleDateString('en-ZA',{weekday:'long',day:'2-digit',month:'long',year:'numeric'});
  const printDate=new Date().toLocaleDateString('en-ZA',{day:'2-digit',month:'long',year:'numeric'});
  const pd=promoData[String(n)]||{};
  const uids=pd.uids||{};
  const pulled=pd.pulled||{};
  const liveUID=pd.liveUID||'';
  const liveType=pd.liveType||'LIVE SHOW';

  const thS='padding:8px 10px;font-size:8px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:#fff;background:#1a3a6a;text-align:left';
  const tdS='padding:8px 10px;font-size:10px;vertical-align:middle';

  const promoRows=PROMO_TYPES.map((pt,i)=>{
    const txDates=getPromoTXDates(epDate,pt.txType);
    const uid=uids[pt.key]||'';
    const isPulled=pulled[pt.key]||false;
    const slug=buildSlug(currentSeason,n,pt.slug);
    const combined=uid&&!isPulled?`${uid} ${slug}`:isPulled?'PULLED':'—';
    const bg=isPulled?'#fff5f5':i%2===0?'#fff':'#f7f9fc';
    const codeColor=isPulled?'#cc0000':'#1a5c1a';
    return`<tr style="background:${bg}">
      <td style="${tdS};font-weight:700;${isPulled?'text-decoration:line-through;color:#aaa':''}">${pt.label}</td>
      <td style="${tdS}">${esc(pd['txFrom_'+pt.key]||txDates.from)}</td>
      <td style="${tdS}">${esc(pd['txTo_'+pt.key]||txDates.to)}</td>
      <td style="${tdS};font-family:monospace;font-weight:700;color:${codeColor};font-size:11px;word-break:break-all">${esc(combined)}</td>
    </tr>`;
  }).join('');

  const html=`<!DOCTYPE html><html><head><meta charset="UTF-8">
  <style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:Arial,Helvetica,sans-serif;color:#111;background:#fff;font-size:10pt;-webkit-print-color-adjust:exact;print-color-adjust:exact}@page{margin:10mm;size:A4 landscape}table{table-layout:fixed;width:100%;border-collapse:collapse}</style>
  </head><body>
  <!-- HEADER -->
  <table style="margin-bottom:14px;border-bottom:3px solid #1a3a6a;padding-bottom:10px">
    <tr valign="middle">
      <td style="width:80px"><img src="${BAKED_CB_LOGO}" style="height:44px;width:auto"></td>
      <td style="text-align:center;padding:0 16px">
        <div style="font-size:15px;font-weight:900;text-transform:uppercase;letter-spacing:1.5px;color:#111">PROMO SCHEDULING CARTE BLANCHE SEASON ${currentSeason} EPISODE ${epStr}</div>
        <div style="font-size:9px;color:#888;margin-top:4px;font-weight:600;text-transform:uppercase">Broadcast: ${sunDate} &nbsp;·&nbsp; Generated: ${printDate}</div>
      </td>
      <td style="width:80px;text-align:left;padding-left:4px"><img src="${BAKED_CAP_LOGO}" style="height:36px;width:auto;max-width:76px;display:block"></td>
    </tr>
  </table>
  <!-- LIVE SHOW ROW -->
  <table style="margin-bottom:12px;border:2px solid #1a3a6a;border-radius:4px">
    <tr style="background:#e8f5e8">
      <td style="padding:8px 12px;font-weight:800;font-size:12px;color:#1a5c1a;width:130px">${esc(liveType)}</td>
      <td style="padding:8px 12px;font-size:10px;color:#555"><span style="font-weight:700;color:#888">TX:</span> ${sunDate}</td>
      <td style="padding:8px 12px;font-size:10px;font-weight:700;font-family:monospace;color:#1a3a6a;letter-spacing:1px">${liveUID?`UID: ${esc(liveUID)}`:'<span style="color:#aaa">No UID entered</span>'}</td>

    </tr>
  </table>
  <!-- PROMO TABLE -->
  <table>
    <colgroup>
      <col style="width:20%"><col style="width:17%"><col style="width:17%"><col style="width:46%">
    </colgroup>
    <thead><tr>
      <th style="${thS}">Type</th>
      <th style="${thS}">TX From</th>
      <th style="${thS}">TX To</th>
      <th style="${thS}">Promo Scheduling Code</th>
    </tr></thead>
    <tbody>${promoRows}</tbody>
  </table>
  <div style="margin-top:10px;text-align:center;font-size:7px;color:#aaa;border-top:1px solid #ddd;padding-top:6px">CONFIDENTIAL · Combined Artists Productions · Carte Blanche Season ${currentSeason} · Episode ${epStr}</div>
  </body></html>`;

  // Download as HTML — open in browser, Cmd+P → Save as PDF
  // Text is fully selectable/copyable in the HTML file
  const blob=new Blob([html],{type:'text/html;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download=`CB-Promo-Schedule-S${currentSeason}-EP${epStr}.html`;
  document.body.appendChild(a);
  a.click();
  setTimeout(()=>{document.body.removeChild(a);URL.revokeObjectURL(url);},3000);
  showToast('Downloaded — open file in browser, Cmd+P to save as PDF. Text is fully copyable.');
}

async function exportPromoXLSX(epNum){
  // Load SheetJS on demand
  if(!window.XLSX){
    await new Promise((res,rej)=>{
      const s=document.createElement('script');
      s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
      s.onload=res;s.onerror=rej;document.head.appendChild(s);
    });
  }
  const n=epNum;
  const epDate=resolveDate(Number(n));
  const epStr=String(n).padStart(2,'0');
  const sunDate=new Date(epDate).toLocaleDateString('en-ZA',{weekday:'long',day:'2-digit',month:'long',year:'numeric'});
  const pd=promoData[String(n)]||{};
  const uids=pd.uids||{};
  const liveUID=pd.liveUID||'';
  const liveType=pd.liveType||'LIVE SHOW';

  const wb=XLSX.utils.book_new();
  const title=`PROMO SCHEDULING CARTE BLANCHE SEASON ${currentSeason} EPISODE ${epStr}`;

  // Build rows
  const rows=[
    [title],
    [`Broadcast: TX: ${sunDate}`],
    [],
    ['TYPE','TX FROM','TX TO','PROMO SCHEDULING CODE'],
    // Live show row
    [liveType, `TX: ${sunDate}`, '', liveUID||''],
    [],
  ];

  PROMO_TYPES.forEach(pt=>{
    const txDates=getPromoTXDates(epDate,pt.txType);
    const uid=uids[pt.key]||'';
    const slug=buildSlug(currentSeason,n,pt.slug);
    const combined=uid?`${uid} ${slug}`:'';
    rows.push([
      pt.label,
      pd['txFrom_'+pt.key]||txDates.from,
      pd['txTo_'+pt.key]||txDates.to,
      combined
    ]);
  });

  const ws=XLSX.utils.aoa_to_sheet(rows);

  // Column widths
  ws['!cols']=[{wch:20},{wch:18},{wch:18},{wch:45}];

  // Merge title row across 4 cols
  ws['!merges']=[
    {s:{r:0,c:0},e:{r:0,c:3}},
    {s:{r:1,c:0},e:{r:1,c:3}},
  ];

  XLSX.utils.book_append_sheet(wb,ws,`EP${epStr} Promos`);
  XLSX.writeFile(wb,`CB-Promo-Schedule-S${currentSeason}-EP${epStr}.xlsx`);
  showToast(`Excel exported for Episode ${n}`);
}

function updateComm(id,field,val){
  comms=comms.map(c=>c.id===id?{...c,[field]:val}:c);
  const updated=comms.find(c=>c.id===id);
  if(updated)saveComm(updated);
  // Update row class and checkbox styles in-place without re-render
  const row=document.querySelector(`tr[data-id="${id}"]`);
  if(row&&updated){
    const c=updated;
    const incRow=!c.decommissioned&&!c.approvedForPayment&&!c.isInHouse&&c.storyName;
    row.className=c.decommissioned?'decom-row':c.approvedForPayment?'paid-row':incRow?'yellow-row':'';
    const pCb=row.querySelector('input[data-field="approvedForPayment"]');
    if(pCb)pCb.style.accentColor=c.approvedForPayment?'#388bfd':'';
    DEL_KEYS.forEach(k=>{const cb=row.querySelector(`input[data-field="${k}"]`);if(cb)cb.className='cb'+(c[k]?' g':'');});
    // Re-apply in-house greying
    const greyCrewFields=['dop','ca','editor'];
    const greyForIHorLic=c.isInHouse||c.isLicensed;
    greyCrewFields.forEach(f=>{
      const td=row.querySelector(`input[data-field="${f}"]`)?.closest('td');
      if(td){td.style.opacity=greyForIHorLic?'0.3':'';td.style.pointerEvents=greyForIHorLic?'none':'';}
    });
    const afmTd=row.querySelector('input[data-field="afm"]')?.closest('td');
    if(afmTd){afmTd.style.opacity=c.isLicensed?'0.3':'';afmTd.style.pointerEvents=c.isLicensed?'none':'';}
    const csTd=row.querySelector('input[data-field="callSheets"]')?.closest('td');
    if(csTd){csTd.style.opacity=greyForIHorLic?'0.3':'';csTd.style.pointerEvents=greyForIHorLic?'none':'';}
    // Grey paid duration cell for in-house
    const paidDurTd=row.querySelector('input[data-field="paidDuration"]')?.closest('td');
    if(paidDurTd){paidDurTd.style.opacity=c.isInHouse?'0.3':'';paidDurTd.style.pointerEvents=c.isInHouse?'none':'';}
    // Grey ✓ Paid checkbox TD for in-house
    const paidCbTd=row.querySelector('input[data-field="approvedForPayment"]')?.closest('td');
    if(paidCbTd){paidCbTd.style.opacity=c.isInHouse?'0.3':'';paidCbTd.style.pointerEvents=c.isInHouse?'none':'';}
  }
  updateTicker();
}

function updateTicker(){
  const paid=comms.filter(c=>!c.isInHouse&&!c.decommissioned).reduce((s,c)=>s+toDecimalMins(c.paidDuration),0);
  const rem=(settings.contractedMinutes||438)-paid;
  const pe=document.querySelector('.t-val.p');const re=document.querySelector('.t-val.r');
  if(pe)pe.textContent=paid.toFixed(1);if(re)re.textContent=rem.toFixed(1);
}

function getEpNums(){const s=new Set();comms.forEach(c=>{if(c.broadcastEpisode)s.add(Number(c.broadcastEpisode));});Object.keys(settings.epDates||{}).forEach(k=>s.add(Number(k)));return Array.from(s).sort((a,b)=>a-b);}
function nextSunday(iso){
  // Given an ISO date, return the next Sunday on or after it
  const d=new Date(iso+'T00:00:00');
  const day=d.getDay(); // 0=Sun
  if(day===0)return iso;
  d.setDate(d.getDate()+(7-day));
  return d.toISOString().split('T')[0];
}
function resolveDate(n){
  if(n===1)return'2026-04-05'; // fixed start — already a Sunday
  if(settings.epDates&&settings.epDates[n])return settings.epDates[n];
  // Auto: previous episode date + 7 days (always lands on Sunday since ep1 is Sunday)
  const prev=resolveDate(n-1);
  const auto=addDays(prev,7);
  return nextSunday(auto); // safety snap to Sunday
}

function allDel(c){return DEL_KEYS.every(k=>c[k]);}
function isDup(id,code){if(!code)return false;return comms.some(c=>c.id!==id&&(c.shortName||'').toUpperCase()===(code||'').toUpperCase());}
function getPaidMins(){
  // Ticker: contracted minus sum of all INSERT (paid) minutes across all episodes
  return comms.filter(c=>!c.isInHouse&&!c.decommissioned).reduce((s,c)=>s+toDecimalMins(c.paidDuration),0);
}

function getFiltered(){
  let list=[...comms];
  if(search){const q=search.toLowerCase();list=list.filter(c=>(c.storyName||'').toLowerCase().includes(q)||(c.shortName||'').toLowerCase().includes(q)||String(c.commNum).includes(q)||(c.producer||'').toLowerCase().includes(q)||(c.presenterVO||'').toLowerCase().includes(q));}
  if(filter==='paid')list=list.filter(c=>c.approvedForPayment);
  if(filter==='unpaid')list=list.filter(c=>!c.approvedForPayment&&!c.decommissioned);
  if(filter==='portal')list=list.filter(c=>c.portal);
  if(filter==='decom')list=list.filter(c=>c.decommissioned);
  if(filter==='inhouse')list=list.filter(c=>c.isInHouse);
  if(filter==='ready')list=list.filter(c=>allDel(c)&&!c.approvedForPayment&&!c.decommissioned);
  list.sort((a,b)=>{let av=a[sortField],bv=b[sortField];if(typeof av==='boolean')av=av?1:0;if(typeof bv==='boolean')bv=bv?1:0;if(typeof av==='string')av=av.toLowerCase();if(typeof bv==='string')bv=bv.toLowerCase();return av<bv?(sortDir==='asc'?-1:1):av>bv?(sortDir==='asc'?1:-1):0;});
  return list;
}

function showToast(msg,err=false){
  toast={msg,err};clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>{const t=document.getElementById('toast-el');if(t)t.style.display='none';toast=null;},3000);
  const t=document.getElementById('toast-el');
  if(t){t.textContent='✓ '+msg;t.className='toast'+(err?' err':'');t.style.display='block';}
  else{render();}
}

function render(){
  const root=document.getElementById('root');
  const cfg=getCfg();
  if(!cfg){root.innerHTML=renderSetup();bindSetup();return;}
  if(!currentUser){root.innerHTML=renderAuth();bindAuth();return;}
  root.innerHTML=renderApp();
  bindApp();
  if(pendingFocusId!==null){
    const newRow=document.querySelector(`tr[data-id="${pendingFocusId}"]`);
    if(newRow){
      const fi=newRow.querySelector('input.ci[data-field="commNum"]');
      if(fi){fi.focus();fi.select();}
      newRow.scrollIntoView({block:'nearest',behavior:'smooth'});
      pendingFocusId=null;
    }
  }
}

function bindAuth(){
  const doLogin=async()=>{
    const email=document.getElementById('login-email').value.trim();
    const pass=document.getElementById('login-pass').value;
    const btn=document.getElementById('login-btn');
    const err=document.getElementById('auth-err');
    if(!email||!pass){err.textContent='Please enter email and password.';err.style.display='block';return;}
    btn.disabled=true;btn.textContent='Signing in…';
    const res=await login(email,pass);
    if(!res.ok){err.textContent=res.error;err.style.display='block';btn.disabled=false;btn.textContent='Sign In';}
  };
  document.getElementById('login-btn').addEventListener('click',doLogin);
  document.getElementById('login-pass').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
}

function getECValue(epNum, sectionId, key, def){
  // Per-episode override first, then fixed, then default
  const ep = endCredits[String(epNum)]||{};
  const fixed = endCredits['fixed']||{};
  const k = sectionId+'_'+key;
  if(ep[k]!==undefined && ep[k]!=='') return ep[k];
  if(fixed[k]!==undefined && fixed[k]!=='') return fixed[k];
  return def||'';
}

function saveECValue(epNum, sectionId, key, val){
  const k = sectionId+'_'+key;
  if(epNum==='fixed'){
    if(!endCredits['fixed'])endCredits['fixed']={};
    endCredits['fixed'][k]=val;
    saveEndCredits('fixed', endCredits['fixed']);
  } else {
    if(!endCredits[epNum])endCredits[epNum]={};
    endCredits[epNum][k]=val;
    saveEndCredits(epNum, endCredits[epNum]);
  }
}

// ── SA PUBLIC HOLIDAYS 2026 ───────────────────────────────────────
const SA_PUBLIC_HOLIDAYS_2026 = [
  '2026-01-01','2026-03-21','2026-04-03','2026-04-06',
  '2026-04-27','2026-05-01','2026-06-16','2026-06-17',
  '2026-08-10','2026-09-24','2026-12-16','2026-12-25','2026-12-26'
];

function isWeekendOrHoliday(dateStr){
  const d=new Date(dateStr);
  const dow=d.getDay();
  if(dow===0||dow===6)return true;
  return SA_PUBLIC_HOLIDAYS_2026.includes(dateStr);
}

function countWorkingDays(startStr,endStr){
  if(!startStr||!endStr)return 0;
  const start=new Date(startStr);
  const end=new Date(endStr);
  if(end<start)return 0;
  let count=0;
  const cur=new Date(start);
  while(cur<=end){
    const ds=cur.toISOString().slice(0,10);
    if(!isWeekendOrHoliday(ds))count++;
    cur.setDate(cur.getDate()+1);
  }
  return count;
}

// Refocus credits editor before formatting — preserves selection
// Save and restore selection for credits editor colour commands
const _savedCredSels={};
function saveCredSel(){
  const sel=window.getSelection();
  if(sel&&sel.rangeCount>0){
    try{return sel.getRangeAt(0).cloneRange();}catch(e){}
  }
  return null;
}
function applyCredColour(colour,ep){
  const ed=document.getElementById('credits-editor-'+ep);
  if(!ed)return;
  // Get current selection before focus changes
  const sel=window.getSelection();
  if(sel&&sel.rangeCount>0&&ed.contains(sel.anchorNode)){
    // Selection is inside editor — apply directly
    document.execCommand('foreColor',false,colour);
  } else {
    // Restore last saved selection then apply
    const saved=_savedCredSels['ep'+ep];
    if(saved){
      ed.focus();
      try{
        const s2=window.getSelection();
        s2.removeAllRanges();
        s2.addRange(saved);
        document.execCommand('foreColor',false,colour);
      }catch(e){console.error(e);}
    }
  }
}

let _lastCreditorSel=null;
function refocusEditor(ep){
  const ed=document.getElementById('credits-editor-'+ep);
  if(!ed)return;
  ed.focus();
  if(_lastCreditorSel){
    try{const sel=window.getSelection();sel.removeAllRanges();sel.addRange(_lastCreditorSel);}catch(e){}
  }
}
document.addEventListener('selectionchange',()=>{
  const sel=window.getSelection();
  const ed=document.activeElement;
  if(sel&&sel.rangeCount&&ed?.id?.startsWith('credits-editor-')){
    const ep=ed.id.replace('credits-editor-','');
    try{
      _savedCredSels['ep'+ep]=sel.getRangeAt(0).cloneRange();
      _lastCreditorSel=_savedCredSels['ep'+ep];
    }catch(e){}
  }
});

// Move story up or down in episode register
function moveStory(id,dir){
  const comm=comms.find(c=>Number(c.id)===Number(id));
  if(!comm){showToast('Story not found',true);return;}
  let epStories=comms.filter(c=>c.broadcastEpisode&&c.broadcastEpisode===comm.broadcastEpisode&&!c.decommissioned);
  if(epStories.length<2){
    const allEps=getEpNums();
    for(const ep of allEps){
      const group=comms.filter(c=>String(c.broadcastEpisode)===String(ep)&&!c.decommissioned);
      if(group.find(c=>Number(c.id)===Number(id))){epStories=group;break;}
    }
  }
  if(epStories.length<2){showToast('Only one story — nothing to reorder',true);return;}
  epStories.sort((a,b)=>(a.broadcastOrder||999)-(b.broadcastOrder||999));
  if(epStories.every(c=>!c.broadcastOrder)){epStories.forEach((c,i)=>{c.broadcastOrder=i+1;});}
  const idx=epStories.findIndex(c=>Number(c.id)===Number(id));
  if(idx<0){showToast('Story not in list',true);return;}
  if(dir==='up'){
    if(idx===0){showToast('Already first',true);return;}
    const prev=epStories[idx-1];
    const tmp=prev.broadcastOrder||idx;
    prev.broadcastOrder=comm.broadcastOrder||(idx+1);
    comm.broadcastOrder=tmp;
    saveComm(comm);saveComm(prev);showToast('Moved up ✓');
  } else {
    if(idx>=epStories.length-1){showToast('Already last',true);return;}
    const next=epStories[idx+1];
    const tmp=next.broadcastOrder||(idx+2);
    next.broadcastOrder=comm.broadcastOrder||(idx+1);
    comm.broadcastOrder=tmp;
    saveComm(comm);saveComm(next);showToast('Moved down ✓');
  }
  render();
}

function renderDeliverables(epNums){
  if(!epNums.length) return`<div class="ep-wrap"><div style="color:#6e7681;padding:32px;text-align:center">No episodes yet.</div></div>`;

  const thBase='position:sticky;top:0;z-index:2;background:#1a2035;padding:8px 10px;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:#7a8ba0;white-space:nowrap;text-align:center;border-bottom:2px solid #2e3a50;min-width:80px';
  const tdBase='padding:6px 8px;text-align:center;border-bottom:1px solid #1a2035;vertical-align:middle';

  // Episode headers
  const epHeaders=epNums.map(n=>{
    const date=new Date(resolveDate(n)).toLocaleDateString('en-ZA',{day:'2-digit',month:'short'});
    const finalised=isEpFinalised(n);
    return`<th style="${thBase}">
      <div style="font-size:11px;font-weight:900;color:${finalised?'#4ade80':'#eaf0ff'}">EP ${String(n).padStart(2,'0')}</div>
      <div style="font-size:9px;color:#6e7681;font-weight:600;margin-top:2px">${date}</div>
      ${finalised?`<div style="font-size:8px;color:#4ade80;margin-top:2px">✓ DONE</div>`:''}
    </th>`;
  }).join('');

  // Task rows
  const taskRows=DELIVERABLE_TASKS.map((task,ti)=>{
    const rowBg=ti%2===0?'':'background:#1a2035';
    const cells=epNums.map(n=>{
      const d=deliverables[String(n)]||{};
      const checked=!!d[task.key];
      const finalised=isEpFinalised(n);
      return`<td style="${tdBase};${rowBg}">
        <input type="checkbox" class="deliv-cb"
          data-ep="${n}" data-key="${task.key}"
          ${checked?'checked':''}
          style="width:16px;height:16px;cursor:pointer;accent-color:${finalised?'#4ade80':'#58a6ff'}">
      </td>`;
    }).join('');

    // Count how many episodes have this task done
    const doneCount=epNums.filter(n=>deliverables[String(n)]?.[task.key]).length;
    const pct=epNums.length?Math.round(doneCount/epNums.length*100):0;

    return`<tr style="${rowBg}">
      <td style="padding:7px 12px;font-size:12px;font-weight:600;color:#eaf0ff;white-space:nowrap;position:sticky;left:0;background:${ti%2===0?'#161b22':'#1a2035'};z-index:1;border-bottom:1px solid #1a2035;min-width:260px">
        ${task.label}
        <span style="margin-left:8px;font-size:10px;color:#484f58">${doneCount}/${epNums.length}</span>
      </td>
      ${cells}
    </tr>`;
  }).join('');

  // Completion row
  const completionCells=epNums.map(n=>{
    const d=deliverables[String(n)]||{};
    const done=DELIVERABLE_TASKS.filter(t=>d[t.key]).length;
    const total=DELIVERABLE_TASKS.length;
    const pct=Math.round(done/total*100);
    const col=pct===100?'#4ade80':pct>=50?'#e3b341':'#f85149';
    return`<td style="${tdBase};border-top:2px solid #2e3a50">
      <div style="font-size:11px;font-weight:900;color:${col}">${pct}%</div>
      <div style="font-size:9px;color:#6e7681">${done}/${total}</div>
    </td>`;
  }).join('');

  return`<div class="ep-wrap" style="padding-bottom:40px">
    <div style="margin-bottom:14px;display:flex;align-items:center;justify-content:space-between">
      <div>
        <div style="font-size:15px;font-weight:800;color:#eaf0ff">Deliverables</div>
        <div style="font-size:11px;color:#6e7681;margin-top:2px">Track completion of all episode deliverables · Admin only</div>
      </div>
      <div style="display:flex;gap:8px">
        <button class="btn" id="deliv-reset-btn" style="font-size:11px;border-color:#f85149;color:#f85149">Reset Episode…</button>
      </div>
    </div>
    <div style="overflow-x:auto;overflow-y:auto;max-height:calc(100vh - 180px)">
      <table style="border-collapse:collapse;min-width:max-content">
        <thead>
          <tr>
            <th style="${thBase};text-align:left;position:sticky;left:0;z-index:3;min-width:260px;background:#1a2035">Deliverable</th>
            ${epHeaders}
          </tr>
        </thead>
        <tbody>
          ${taskRows}
          <tr>
            <td style="padding:7px 12px;font-size:11px;font-weight:800;color:#7a8ba0;text-transform:uppercase;letter-spacing:.5px;position:sticky;left:0;background:#161b22;z-index:1;border-top:2px solid #2e3a50">Completion</td>
            ${completionCells}
          </tr>
        </tbody>
      </table>
    </div>
  </div>`;
}

  const modal=pullReplaceModal?`<div class="modal-overlay" id="pull-modal-overlay"><div class="modal" style="max-width:420px">
    <h3 style="margin-bottom:12px">Promo Pulled</h3>
    <p style="margin-bottom:6px;color:#8b949e;font-size:13px"><strong style="color:#eaf0ff">${PROMO_TYPES.find(p=>p.key===pullReplaceModal.key)?.label}</strong> · EP ${String(pullReplaceModal.ep).padStart(2,'0')}</p>
    <p style="margin-bottom:16px;color:#8b949e;font-size:13px">UID: <span style="font-family:monospace;color:#f85149">${pullReplaceModal.uid}</span></p>
    <p style="margin-bottom:20px;font-size:14px;color:#eaf0ff">Replace this pulled promo with an available UID?</p>

function renderStudioCrew(epNums){

  const cards=epNums.map(n=>{
    const sc=studioCrew[String(n)]||{};
    function labelRow(label,val){return`<div style="display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid #21262d">
      <div style="font-size:10px;font-weight:700;color:#7a8ba0;text-transform:uppercase;letter-spacing:.5px;min-width:160px">${label}</div>
      <div style="flex:1">${val}</div>

    function sci(field){return canEd
      ?`<input class="ci studio-ci" value="${esc(sc[field]||'')}" data-ep="${n}" data-field="${field}" style="width:100%;font-size:13px">`
      :esc(sc[field]||'—');}

  return`<div class="ep-wrap">${cards}</div>`;
}

function bindApp(){
  document.getElementById('logout-btn')?.addEventListener('click',()=>signOut(auth));
  document.getElementById('preview-role-sel')?.addEventListener('change',e=>{
    previewRole=e.target.value||null;
    // If switching to editorial, go to episodes tab
    if(previewRole==='editorial')tab='episodes';
    else if(!previewRole)tab='commissions';
    render();
  });
  document.getElementById('season-sel')?.addEventListener('change',e=>{
    if(e.target.value==='new'){
      const name=prompt('Enter new season name (e.g. S40):');
      if(name&&name.trim()){
        const opt=document.createElement('option');
        opt.value=name.trim();opt.textContent='Season '+name.trim().replace(/^s/i,'');
        const sel=document.getElementById('season-sel');
        sel.insertBefore(opt,sel.lastElementChild);
        currentSeason=name.trim();
        sel.value=currentSeason;
        showToast('Season '+currentSeason+' added');
      } else {
        e.target.value=currentSeason; // revert
      }
    } else {
      currentSeason=e.target.value;
      showToast('Switched to Season '+currentSeason.replace(/^s/i,''));
    }
  });
  document.addEventListener('click',function tabHandler(e){
    const el=e.target.closest('[data-tab]');
    if(!el)return;
    // Ignore if it's inside an ep-order button
    if(e.target.closest('.ep-order-up,.ep-order-dn'))return;
    tab=el.dataset.tab;render();
  });
  document.querySelectorAll('[data-home-tab]').forEach(el=>el.addEventListener('click',()=>{tab=el.dataset.homeTab;render();}));
  document.getElementById('contracted-input')?.addEventListener('change',e=>{settings.contractedMinutes=Number(e.target.value);saveSettings();render();});
  document.querySelectorAll('[data-sort]').forEach(th=>th.addEventListener('click',()=>{const f=th.dataset.sort;if(sortField===f)sortDir=sortDir==='asc'?'desc':'asc';else{sortField=f;sortDir='asc';}render();}));
  document.getElementById('search-inp')?.addEventListener('input',e=>{search=e.target.value;render();});
  document.getElementById('filter-sel')?.addEventListener('change',e=>{filter=e.target.value;render();});
  ['add-row-btn','add-row-btn2'].forEach(id=>document.getElementById(id)?.addEventListener('click',addRow));
  ['add-ep-btn','add-ep-btn2'].forEach(id=>document.getElementById(id)?.addEventListener('click',()=>{const e=getEpNums();newEpNum=String(e.length?Math.max(...e)+1:1);addEpModal=true;render();}));

  document.getElementById('comm-report-btn')?.addEventListener('click',async()=>{
    const btn=document.getElementById('comm-report-btn');
    const epSel=document.getElementById('crew-ep-sel');
    const filterEp=epSel?epSel.value:'all';
    btn.innerHTML='⏳ Preparing Crew List…';
    btn.disabled=true;

    if(!window.html2pdf){
      await new Promise((res,rej)=>{
        const s=document.createElement('script');
        s.src='https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js';
        s.onload=res;s.onerror=rej;
        document.head.appendChild(s);
      });
    }

    const CB_LOGO=BAKED_CB_LOGO;
    const CAP_LOGO=BAKED_CAP_LOGO;
    const printDate=new Date().toLocaleDateString('en-ZA',{day:'2-digit',month:'long',year:'numeric'});
    const epNums=getEpNums().filter(n=>filterEp==='all'||String(n)===filterEp);

    function labelRow(label,value,bold=false){
      return`<tr>
        <td style="padding:5px 0 5px 0;font-size:10px;font-weight:700;color:#555;text-transform:uppercase;letter-spacing:.5px;width:38%;vertical-align:top">${label}:</td>
        <td style="padding:5px 0 5px 12px;font-size:11px;font-weight:${bold?'800':'500'};color:#111;vertical-align:top">${value||'—'}</td>
      </tr>`;
    }

    const headerHTML=`
      <div style="display:flex;align-items:center;justify-content:space-between;padding-bottom:14px;margin-bottom:0">
        <img src="${CB_LOGO}" style="height:56px;width:auto;object-fit:contain">
        <div style="text-align:center;flex:1;padding:0 24px">
          <div style="font-size:20px;font-weight:900;text-transform:uppercase;letter-spacing:2px;color:#111;line-height:1.1">CARTE BLANCHE CREW LIST</div>
          <div style="font-size:9px;color:#888;margin-top:5px;font-weight:600;text-transform:uppercase;letter-spacing:.8px">Combined Artists Productions · Production Portal</div>
        </div>
        <img src="${CAP_LOGO}" style="height:34px;width:auto;object-fit:contain">
      </div>`;

    const epPages=epNums.map(n=>{
      const date=resolveDate(n);

          'FLOOR MANAGER':['carteBlanche','floorMgr'],
          'ASSISTANT STUDIO DIRECTOR':['carteBlanche','asd'],
          'STUDIO DIRECTOR':['carteBlanche','sd'],
          'EDITORIAL ASSISTANT':['carteBlanche','editAsst'],
          'CONTENT EDITOR':['carteBlanche','contentEd'],
          'ONLINE EDITOR':['carteBlanche','onlineEd'],
          'EDITORIAL MANAGER':['carteBlanche','editMgr'],
          'PRODUCER':['carteBlanche','producer'],
          'EXECUTIVE PRODUCER':['carteBlanche','execProd'],
        };

        // Presenters — lines after PRESENTERS heading until next heading
        const presenterKeys=['p1','p2','p3','p4','p5','p6'];
        const vpKeys=['vp1','vp2','vp3','vp4','vp5'];
        const legalKeys=['legal1','legal2','legal3','legal4','legal5'];

        const fixedData={};
        let i=0;
        while(i<lines.length){
          const line=lines[i].toUpperCase();
          if(line==='PRESENTERS'){
            i++;let pi=0;
            while(i<lines.length&&pi<6&&!known[lines[i].toUpperCase()]&&lines[i].toUpperCase()!=='CARTE BLANCHE VIEWER PANEL'){
              if(presenterKeys[pi])fixedData['presenters_'+presenterKeys[pi]]=lines[i];pi++;i++;
            }continue;
          }
          if(line==='CARTE BLANCHE VIEWER PANEL'){
            i++;let vi=0;
            while(i<lines.length&&vi<5&&!known[lines[i].toUpperCase()]&&lines[i].toUpperCase()!=='CARTE BLANCHE THEME'){
              if(vpKeys[vi])fixedData['viewerPanel_'+vpKeys[vi]]=lines[i];vi++;i++;
            }continue;
          }
          if(line==='LEGAL ADVISORS'){
            i++;let li=0;
            while(i<lines.length&&li<5&&!known[lines[i].toUpperCase()]){
              fixedData['theme_'+legalKeys[li]]=lines[i];li++;i++;
              if(li>=5||known[(lines[i]||'').toUpperCase()])break;
            }continue;
          }
          if(known[line]){
            const[sec,key]=known[line];
            if(i+1<lines.length){
              fixedData[sec+'_'+key]=lines[i+1];
              i+=2;
            } else {i++;}
            continue;
          }
          i++;
        }

        // Save to fixed
        if(!endCredits['fixed'])endCredits['fixed']={};
        Object.assign(endCredits['fixed'],fixedData);
        await saveEndCredits('fixed',endCredits['fixed']);
        showToast('Credits imported from Word — '+Object.keys(fixedData).length+' fields updated');
        render();
      }catch(err){
        showToast('Import failed: '+err.message,true);
        console.error(err);
      }
      fileInp.value='';

// ── AUTOCOMPLETE ────────────────────────────────────────────────
const AC_FIELDS = ['producer','presenterVO','dop','ca','editor','afm'];

function getACValues(field) {
  // Collect all unique non-empty values for this field from current commissions
  const vals = new Set();
  comms.forEach(c => { if (c[field] && String(c[field]).trim()) vals.add(String(c[field]).trim()); });
  return Array.from(vals).sort();
}

function attachAutocomplete(inp, field) {
  if (!inp || inp.dataset.acAttached) return;
  inp.dataset.acAttached = '1';

  let dropEl = null;
  let selectedIdx = -1;

  function closeDrop() {
    if (dropEl) { dropEl.remove(); dropEl = null; }
    selectedIdx = -1;
  }

  function openDrop(matches) {
    closeDrop();
    if (!matches.length) return;
    const wrap = inp.closest('.ac-wrap') || inp.parentElement;
    dropEl = document.createElement('div');
    dropEl.className = 'ac-drop';
    matches.forEach((val, i) => {
      const item = document.createElement('div');
      item.className = 'ac-item';
      item.dataset.value = v;
      // Highlight the matching part
      const q = inp.value.trim();
      const idx = val.toLowerCase().indexOf(q.toLowerCase());
      if (idx >= 0) {
        item.innerHTML = esc(val.substring(0,idx)) + '<em>' + esc(val.substring(idx,idx+q.length)) + '</em>' + esc(val.substring(idx+q.length));
      } else {
        item.textContent = val;
      }
      item.addEventListener('mousedown', e => {
        e.preventDefault();
        inp.value = val;
        inp.dispatchEvent(new Event('input', {bubbles:true}));
        inp.dispatchEvent(new Event('blur', {bubbles:false}));
        closeDrop();
      });
      dropEl.appendChild(item);
    });
    // Position relative to input
    inp.parentElement.style.position = 'relative';
    inp.parentElement.appendChild(dropEl);
  }

  inp.addEventListener('input', () => {
    const q = inp.value.trim();
    if (!q) { closeDrop(); return; }
    const vals = getACValues(field);
    const matches = vals.filter(v => v.toLowerCase().includes(q.toLowerCase()) && v !== q);
    openDrop(matches.slice(0, 8));
    selectedIdx = -1;
  });

  inp.addEventListener('keydown', e => {
    if (!dropEl) return;
    const items = dropEl.querySelectorAll('.ac-item');
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      selectedIdx = Math.min(selectedIdx + 1, items.length - 1);
      items.forEach((el,i) => el.classList.toggle('selected', i === selectedIdx));
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      selectedIdx = Math.max(selectedIdx - 1, 0);
      items.forEach((el,i) => el.classList.toggle('selected', i === selectedIdx));
    } else if (e.key === 'Enter' && selectedIdx >= 0) {
      e.preventDefault();
      e.stopPropagation(); // prevent the row-level Enter handler from firing
      inp.value = items[selectedIdx].textContent;
      inp.dispatchEvent(new Event('input',{bubbles:true}));
      closeDrop();
      // Save the value then refocus — stays in the same field
      updateComm(Number(inp.closest('tr[data-id]')?.dataset?.id), inp.dataset.field, inp.value);
      setTimeout(()=>{ inp.focus(); inp.select(); }, 10);
    } else if (e.key === 'Escape') {
      closeDrop();
    }
  });

  inp.addEventListener('blur', () => {
    // Small delay so mousedown on item fires first
    setTimeout(closeDrop, 150);
  });

  inp.addEventListener('focus', () => {
    const q = inp.value.trim();
    if (q) {
      const vals = getACValues(field);
      const matches = vals.filter(v => v.toLowerCase().includes(q.toLowerCase()) && v !== q);
      openDrop(matches.slice(0, 8));
    }
  });
}

function attachStudioAutocomplete(inp, field) {
  if(inp.dataset.acAttached)return;
  inp.dataset.acAttached='1';
  let dropEl=null,selectedIdx=-1;
  function closeDrop(){if(dropEl){dropEl.remove();dropEl=null;}selectedIdx=-1;}
  function openDrop(matches){
    closeDrop();if(!matches.length)return;
    dropEl=document.createElement('div');dropEl.className='ac-drop';
    matches.forEach((val,i)=>{
      const item=document.createElement('div');item.className='ac-item';
      const q=inp.value.trim();const idx=val.toLowerCase().indexOf(q.toLowerCase());
      if(idx>=0){item.innerHTML=esc(val.substring(0,idx))+'<em>'+esc(val.substring(idx,idx+q.length))+'</em>'+esc(val.substring(idx+q.length));}
      else{item.textContent=val;}
      item.addEventListener('mousedown',e=>{
        e.preventDefault();
        inp.value=val;
        inp.dispatchEvent(new Event('input',{bubbles:true}));
        // Save and stay in field
        const ep=inp.dataset.ep;
        if(ep){
          if(!studioCrew[ep])studioCrew[ep]={};
          studioCrew[ep][inp.dataset.field]=val;
          saveStudioCrew(ep,studioCrew[ep]);
        } else {
          inp.dispatchEvent(new Event('blur',{bubbles:false}));
        }
        closeDrop();
        setTimeout(()=>{inp.focus();inp.select();},10);
      });
      dropEl.appendChild(item);
    });
    // Attach to the input's parent div (the relative-positioned wrapper)
    const wrapper=inp.parentElement;
    wrapper.style.position='relative';
    wrapper.appendChild(dropEl);
  }
  inp.addEventListener('input',()=>{
    const q=inp.value.trim();
    if(!q){closeDrop();return;}
    const vals=getStudioACValues(field);
    openDrop(vals.filter(v=>v.toLowerCase().includes(q.toLowerCase())&&v!==q).slice(0,8));
    selectedIdx=-1;
  });
  inp.addEventListener('keydown',e=>{
    // Tab — save and move to next studio field
    if(e.key==='Tab'){
      e.preventDefault();
      closeDrop();
      const ep=inp.dataset.ep;
      if(!studioCrew[ep])studioCrew[ep]={};
      studioCrew[ep][field]=inp.value;
      saveStudioCrew(ep,studioCrew[ep]);
      const allStudio=Array.from(document.querySelectorAll('input.studio-ci'));
      const idx=allStudio.indexOf(inp);
      const next=allStudio[idx+(e.shiftKey?-1:1)];
      if(next){next.focus();next.select();}
      return;
    }
    // Enter — select autocomplete item or save and stay in field
    if(e.key==='Enter'){
      e.preventDefault();
      e.stopPropagation();
      if(dropEl){
        const items=dropEl.querySelectorAll('.ac-item');
        // If an item is highlighted use it; otherwise use first visible item
        const targetIdx=selectedIdx>=0?selectedIdx:0;
        if(items[targetIdx]){
          inp.value=items[targetIdx].dataset.value||items[targetIdx].textContent.trim();
          inp.dispatchEvent(new Event('input',{bubbles:true}));
        }
        closeDrop();
      }
      // Save and stay in field
      const ep=inp.dataset.ep;
      if(!studioCrew[ep])studioCrew[ep]={};
      studioCrew[ep][field]=inp.value;
      saveStudioCrew(ep,studioCrew[ep]);
      setTimeout(()=>{inp.focus();inp.select();},10);
      return;
    }
    if(!dropEl)return;
    const items=dropEl.querySelectorAll('.ac-item');
    if(e.key==='ArrowDown'){e.preventDefault();selectedIdx=Math.min(selectedIdx+1,items.length-1);items.forEach((el,i)=>el.classList.toggle('selected',i===selectedIdx));}
    else if(e.key==='ArrowUp'){e.preventDefault();selectedIdx=Math.max(selectedIdx-1,0);items.forEach((el,i)=>el.classList.toggle('selected',i===selectedIdx));}
    else if(e.key==='Escape'){closeDrop();}
  });
  inp.addEventListener('blur',()=>setTimeout(closeDrop,150));
  inp.addEventListener('focus',()=>{
    const q=inp.value.trim();
    if(q){const vals=getStudioACValues(field);openDrop(vals.filter(v=>v.toLowerCase().includes(q.toLowerCase())&&v!==q).slice(0,8));}
  });
}

function attachAllAutocomplete() {
  AC_FIELDS.forEach(field => {
    document.querySelectorAll(`input.ci[data-field="${field}"]`).forEach(inp => {
      attachAutocomplete(inp, field);
    });
  });
}
