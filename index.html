      const txDate=resolveDate(Number(c.broadcastEpisode));
      if(txDate&&txDate<today)return false; // already broadcast
    }
    return true;
  });
  const eps=[...epNums].sort((a,b)=>a-b);

  function getLineup(ep){
    const saved=lineups[String(ep)];
    // Auto-populate commission items from Commission List
    const epComms=comms
      .filter(c=>!c.decommissioned&&Number(c.broadcastEpisode)===Number(ep)&&c.commNum&&c.storyName)
      .sort((a,b)=>(a.broadcastOrder||999)-(b.broadcastOrder||999));
    const autoItems=epComms.map(c=>({commNum:String(c.commNum),liveStudio:false}));
    if(!saved){
      // No saved lineup — return auto-populated from Commission List
      return {director:'',presenter1:'',presenter2:'',items:autoItems};
    }
    // Saved lineup exists — use saved data but merge in any commissions not yet in items
    const savedCommNums=new Set((saved.items||[]).filter(i=>!i.liveStudio).map(i=>String(i.commNum)));
    const missingItems=autoItems.filter(i=>!savedCommNums.has(i.commNum));
    return {...saved, items:[...(saved.items||[]),...missingItems]};
  }
  function epIsPast(ep){const d=resolveDate(Number(ep));return d&&d<today;}
  function getCommData(cn){return activeComms.find(c=>String(c.commNum)===String(cn))||null;}
  function durForComm(c){if(!c)return'';return c.deliveredDuration||c.commDuration||'';}

  function totalMins(ep){
    const lu=getLineup(ep);let t=0;
    (lu.items||[]).forEach(item=>{
      if(item.liveStudio){t+=toDecimalMins(item.liveDuration||'0:00');}
      else if(item.commNum){const c=getCommData(item.commNum);t+=toDecimalMins(durForComm(c));}
    });
    return t;
  }

  // Collapse ALL episodes by default on first open
  if(!window._luAutoCollapsedOnce){
    window._luAutoCollapsedOnce=true;
    eps.forEach(ep=>{luCollapsed.add(String(ep));});
  }
  const sidebarInserts=insertsInProd.filter(c=>c.storyName).sort((a,b)=>Number(a.commNum||0)-Number(b.commNum||0));

  let epsHtml='';
  eps.forEach(ep=>{
    const lu=getLineup(ep);
    const epDate=resolveDate(Number(ep));
    const past=epIsPast(ep);
    const collapsed=luCollapsed.has(String(ep));
    const items=lu.items||[];
    const tot=totalMins(ep);
    const epAccent=past?'#f85149':'#58a6ff';
    const epLabel=`S${currentSeason} EP ${String(ep).padStart(2,'0')}`;

    let itemsHtml='';
    items.forEach((item,idx)=>{
      const rowBg=past?'background:rgba(248,81,73,0.15);border-left:3px solid #f85149':'background:rgba(88,166,255,0.06);border-left:3px solid #1e3a5f';
      if(item.liveStudio){
        itemsHtml+=`<div style="${rowBg};padding:8px 12px;border-radius:4px;margin-bottom:6px;display:flex;align-items:center;gap:8px;flex-wrap:wrap">
          <span style="font-size:11px;font-weight:900;color:${past?'#f85149':'#e3b341'};width:90px;font-family:monospace;flex-shrink:0">LIVE STUDIO</span>
          ${canEdit&&!past
            ?`<input class="lu-live-note" data-ep="${ep}" data-idx="${idx}" value="${esc(item.liveNote||'')}" placeholder="Content note…" style="background:#1c2433;border:1px solid #2e3a50;color:#eaf0ff;padding:3px 8px;border-radius:3px;font-size:11px;flex:1;min-width:120px">`
            :`<span style="font-size:11px;color:${past?'#f87171':'#e3b341'};flex:1;font-style:${item.liveNote?'normal':'italic'}">${esc(item.liveNote||'No note')}</span>`}
          ${canEdit&&!past
            ?`<input class="lu-live-dur" data-ep="${ep}" data-idx="${idx}" value="${esc(item.liveDuration||'')}" placeholder="mm:ss" style="background:#1c2433;border:1px solid #2e3a50;color:#eaf0ff;padding:3px 7px;border-radius:3px;font-size:11px;width:75px;font-family:monospace;flex-shrink:0">`
            :`<span style="font-size:11px;font-weight:700;color:#eaf0ff;font-family:monospace;flex-shrink:0">${esc(item.liveDuration||'—')}</span>`}
          <span style="font-size:11px;font-family:monospace;color:${past?'#f85149':'#3fb950'};flex-shrink:0">${decToMmSs(toDecimalMins(item.liveDuration||''))}</span>
          ${canEdit&&!past?`<button class="lu-remove-item" data-ep="${ep}" data-idx="${idx}" style="background:none;border:none;color:#484f58;cursor:pointer;font-size:14px;line-height:1;flex-shrink:0">✕</button>`:''}
        </div>`;
      } else {
        const c=getCommData(item.commNum);
        const dur=durForComm(c);
        const isDelivered=c&&!!c.deliveredDuration;
        itemsHtml+=`<div style="${rowBg};padding:8px 12px;border-radius:4px;margin-bottom:6px;display:flex;align-items:center;gap:10px;flex-wrap:wrap">
          <span style="font-size:11px;font-weight:900;color:${past?'#f85149':'#58a6ff'};width:50px;font-family:monospace;flex-shrink:0">${esc(String(item.commNum))}</span>
          <span style="font-size:12px;font-weight:700;color:${past?'#f87171':'#eaf0ff'};flex:1;min-width:100px">${esc(c?.storyName||String(item.commNum))}${c?.isLicensed?'<span style="margin-left:5px;font-size:8px;font-weight:800;background:#1c2d1c;color:#3fb950;padding:1px 4px;border-radius:2px;vertical-align:middle">LIC</span>':''}${c?.isInHouse?'<span style="margin-left:5px;font-size:8px;font-weight:800;background:#1a1a2e;color:#7a8ba0;padding:1px 4px;border-radius:2px;vertical-align:middle">IH</span>':''}</span>
          <span style="font-size:11px;color:#8b949e;min-width:70px">${esc(c?.presenterVO||'')}</span>
          <span style="font-size:11px;color:#6e7681;min-width:70px">${esc(c?.producer||'')}</span>
          <span style="font-size:11px;font-family:monospace;color:${isDelivered?'#3fb950':'#8b949e'};min-width:50px;text-align:right" title="${isDelivered?'Delivered':'Commissioned'}">${decToMmSs(toDecimalMins(dur))}${isDelivered?' ✓':''}</span>
          ${canEdit&&!past?`<button class="lu-remove-item" data-ep="${ep}" data-idx="${idx}" style="background:none;border:none;color:#484f58;cursor:pointer;font-size:14px;line-height:1">✕</button>`:''}
        </div>`;
      }
    });

    const usedComms=items.filter(i=>!i.liveStudio).map(i=>String(i.commNum));
    const availableComms=activeComms.filter(c=>c.commNum&&c.storyName&&!usedComms.includes(String(c.commNum))).sort((a,b)=>Number(a.commNum)-Number(b.commNum));

    epsHtml+=`<div data-lu-ep-block="${ep}" data-lu-past="${past?1:0}" style="${past?'background:#1a0a0a;border-color:#3d1f1f':'background:#0d1117;border-color:#21262d'};border:1px solid;border-radius:8px;margin-bottom:16px;overflow:hidden">
      <div class="lu-ep-header" data-lu-ep="${ep}" style="${past?'background:#2d0f0f':'background:#161b22'};padding:12px 16px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;cursor:pointer;user-select:none" title="${collapsed?'Click to expand':'Click to collapse'}">
        <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
          <span class="lu-chevron" style="font-size:13px;color:${epAccent};margin-right:2px">${collapsed?'▶':'▼'}</span>
          <span style="font-size:14px;font-weight:900;color:${epAccent};font-family:monospace">2026 | ${epLabel}</span>
          ${past?`<span style="background:#3d0000;color:#f85149;font-size:9px;font-weight:800;padding:2px 7px;border-radius:3px;border:1px solid #6b1111;letter-spacing:.5px">BROADCAST</span>`:''}
          ${epDate?`<span style="font-size:11px;color:#6e7681">${fmtDate(epDate)}</span>`:''}
        </div>
        <span style="font-size:12px;font-weight:800;color:${tot>0?(past?'#f85149':'#3fb950'):'#484f58'};font-family:monospace">Total: ${decToMmSs(tot)}</span>
      </div>
      <div class="lu-ep-body" style="display:${collapsed?'none':'block'}"><div style="padding:10px 16px;border-bottom:1px solid ${past?'#3d1f1f':'#21262d'};display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px">
        ${['director','presenter1','presenter2'].map(field=>`<div>
          <div style="font-size:9px;font-weight:700;color:#7a8ba0;text-transform:uppercase;margin-bottom:4px">${field==='director'?'Director':field==='presenter1'?'Presenter 1':'Presenter 2'}</div>
          ${canEdit
            ?`<input class="lu-${field}" data-ep="${ep}" value="${esc(lu[field]||'')}" placeholder="${field==='director'?'Director':'Presenter'} name" style="width:100%;background:#1c2433;border:1px solid #2e3a50;color:#eaf0ff;padding:5px 8px;border-radius:4px;font-size:12px;box-sizing:border-box">`
            :`<span style="font-size:12px;font-weight:700;color:#eaf0ff">${esc(lu[field]||'—')}</span>`}
        </div>`).join('')}
      </div>
      <div style="padding:12px 16px">
        ${itemsHtml||`<div style="font-size:12px;color:#484f58;font-style:italic;padding:4px 0">No content added yet.</div>`}
        ${canEdit&&!past?`<div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center">
          <select class="lu-add-comm" data-ep="${ep}" style="flex:1;min-width:180px;background:#1c2433;border:1px solid #2e3a50;color:#eaf0ff;padding:6px 10px;border-radius:4px;font-size:12px">
            <option value="">+ Add commission…</option>
            ${availableComms.map(c=>`<option value="${esc(String(c.commNum))}">${esc(String(c.commNum))} | ${esc(c.storyName)} (${decToMmSs(toDecimalMins(durForComm(c)))})</option>`).join('')}
          </select>
          <button class="lu-add-live" data-ep="${ep}" style="background:#1c2433;border:1px solid #e3b341;color:#e3b341;padding:6px 12px;border-radius:4px;font-size:12px;cursor:pointer;font-weight:700;white-space:nowrap">+ Live Studio</button>
        </div>`:''}
      </div></div>
    </div>`;
  });

  if(!eps.length)epsHtml=`<div style="text-align:center;padding:40px;color:#484f58;font-size:13px">No episodes in the Commission List yet.</div>`;

  let sideHtml=sidebarInserts.map(c=>{
    const isLic=c.isLicensed;
    const isIH=c.isInHouse;
    const borderCol=isLic?'#3fb950':isIH?'#6e7681':'#e3b341';
    const bgCol=isLic?'rgba(63,185,80,0.06)':isIH?'rgba(110,118,129,0.06)':'rgba(227,179,65,0.08)';
    const commCol=isLic?'#3fb950':isIH?'#7a8ba0':'#e3b341';
    const typeTag=isLic?'<span style="font-size:7px;font-weight:800;background:#1c2d1c;color:#3fb950;padding:1px 4px;border-radius:2px;margin-left:4px;vertical-align:middle">LIC</span>':
                  isIH?'<span style="font-size:7px;font-weight:800;background:#1a1a2e;color:#7a8ba0;padding:1px 4px;border-radius:2px;margin-left:4px;vertical-align:middle">IH</span>':'';
    const delDate=c.deliveryDate?new Date(c.deliveryDate+'T00:00:00Z').toLocaleDateString('en-ZA',{day:'2-digit',month:'short',year:'2-digit'}):'';
    const dur=decToMmSs(toDecimalMins(c.deliveredDuration||c.commDuration));
    return`<div style="background:${bgCol};border-left:3px solid ${borderCol};border-radius:3px;padding:7px 10px;margin-bottom:5px">
      <div style="font-size:11px;font-weight:900;color:${commCol};font-family:monospace">${esc(String(c.commNum))}${typeTag}</div>
      <div style="font-size:11px;font-weight:700;color:#eaf0ff;margin-top:1px">${esc(c.storyName)}</div>
      <div style="display:flex;gap:6px;margin-top:3px;align-items:center;flex-wrap:wrap">
        ${c.presenterVO?`<span style="font-size:10px;color:#8b949e">${esc(c.presenterVO)}</span>`:''}
        ${c.producer?`<span style="font-size:10px;color:#6e7681">${esc(c.producer)}</span>`:''}
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:3px;flex-wrap:wrap;gap:4px">
        ${delDate?`<span style="font-size:9px;color:#e3b341;font-weight:700">📅 ${delDate}</span>`:'<span style="font-size:9px;color:#484f58;font-style:italic">No delivery date</span>'}
        <span style="font-size:10px;color:#7a8ba0;font-family:monospace">${dur}</span>
      </div>
    </div>`;
  }).join('');
  if(!sideHtml)sideHtml=`<div style="font-size:11px;color:#484f58;font-style:italic">No inserts in production.</div>`;

  return`<div style="display:flex;gap:0;height:100%;overflow:hidden">
    <div style="flex:1;min-width:0;overflow-y:auto;padding:16px 8px 16px 16px">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
        <h2 style="font-size:16px;font-weight:900;color:#eaf0ff;margin:0">LINE-UPS · Season ${currentSeason}</h2>
        <span style="font-size:10px;color:#484f58">Broadcast episodes shown in red · ✓ = delivered duration</span>
      </div>
      ${epsHtml}
    </div>
    <div style="width:260px;flex-shrink:0;padding:16px 16px 16px 0;overflow-y:auto;height:100%">
      <div style="background:#161b22;border:1px solid #21262d;border-radius:8px;padding:14px">
        <div style="font-size:10px;font-weight:800;color:#e3b341;text-transform:uppercase;letter-spacing:.6px;margin-bottom:12px;border-bottom:1px solid #2e3a50;padding-bottom:8px">Inserts in Production</div>
        ${sideHtml}
      </div>
    </div>
  </div>`;
}

function renderModals(epNums,nextEp){

function bindApp(){
  // ── Fast tab switching: only swap content, not the whole app ──
  const _tabScroll={};
  function switchTab(newTab){
    if(tab===newTab)return;

        const result=await mammoth.extractRawText({arrayBuffer:buf});
        const lines=result.value.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);

        // Parse lines into key-value pairs
        // We match known labels and take the next non-empty line as the value
        const known={
          'COMPOSED BY':['theme','composedBy'],
          'ORCHESTRATION BY':['theme','orchBy'],
          'LOGO & IMAGING':['theme','logoBy'],
          'LOGO & IMAGING BY':['theme','logoBy'],

          'LIGHTING DESIGN':['studio','lightEng'],
          'LIGHTING DESIGN ENGINEERS':['studio','lightEng'],
          'SOUND ASSISTANT':['studio','stSoundAsst'],
          'AUTOCUE':['studio','autocue'],
          'GRAPHICS':['studio','graphics'],
          'CAMERAS':['studio','cameras'],
          'JIMMY JIB':['studio','jimmyJib'],
          'VISION CONTROL':['studio','visionCtrl'],
          'LIGHTING':['studio','lighting'],
          'VT OPERATOR':['studio','vtOp'],
          'SOUND ENGINEER':['studio','soundEng'],
          'VISION MIXER':['studio','visionMix'],
          'PRODUCTION':['production','prod'],
          'PRODUCTION COORDINATOR':['production','prodCoord'],
          'VIDEO EDITORS':['production','vidEd1'],
          'PATRON: MAKING A DIFFERENCE TRUST':['production','patron'],
          'FINANCE MANAGER':['production','finMgr'],
          'MAKE-UP & STYLING':['carteBlanche','makeupStyling'],
          'PRODUCTION MANAGER':['carteBlanche','prodMgr'],
          'OPERATIONAL MANAGER':['carteBlanche','opsMgr'],
          'FLOOR MANAGER':['carteBlanche','floorMgr'],
          'ASSISTANT STUDIO DIRECTOR':['carteBlanche','asd'],
          'STUDIO DIRECTOR':['carteBlanche','sd'],
          'EDITORIAL ASSISTANT':['carteBlanche','editAsst'],
          'CONTENT EDITOR':['carteBlanche','contentEd'],
          'ONLINE EDITOR':['carteBlanche','onlineEd'],
          'EDITORIAL MANAGER':['carteBlanche','editMgr'],
          'PRODUCER':['carteBlanche','producer'],
          'EXECUTIVE PRODUCER':['carteBlanche','execProd'],
        };

        // Presenters — lines after PRESENTERS heading until next heading
        const presenterKeys=['p1','p2','p3','p4','p5','p6'];
        const vpKeys=['vp1','vp2','vp3','vp4','vp5'];
        const legalKeys=['legal1','legal2','legal3','legal4','legal5'];

        const fixedData={};
        let i=0;
        while(i<lines.length){
          const line=lines[i].toUpperCase();
          if(line==='PRESENTERS'){
            i++;let pi=0;
            while(i<lines.length&&pi<6&&!known[lines[i].toUpperCase()]&&lines[i].toUpperCase()!=='CARTE BLANCHE VIEWER PANEL'){
              if(presenterKeys[pi])fixedData['presenters_'+presenterKeys[pi]]=lines[i];pi++;i++;
            }continue;
          }
          if(line==='CARTE BLANCHE VIEWER PANEL'){
            i++;let vi=0;
            while(i<lines.length&&vi<5&&!known[lines[i].toUpperCase()]&&lines[i].toUpperCase()!=='CARTE BLANCHE THEME'){

              fixedData['theme_'+legalKeys[li]]=lines[i];li++;i++;

            }continue;
          }
          if(known[line]){
            const[sec,key]=known[line];
            if(i+1<lines.length){
              fixedData[sec+'_'+key]=lines[i+1];
              i+=2;
            } else {i++;}
            continue;
          }
          i++;
        }

        // Save to fixed
        if(!endCredits['fixed'])endCredits['fixed']={};
        Object.assign(endCredits['fixed'],fixedData);
        await saveEndCredits('fixed',endCredits['fixed']);
        showToast('Credits imported from Word — '+Object.keys(fixedData).length+' fields updated');
        render();

        showToast('Import failed: '+err.message,true);
        console.error(err);

// ── AUTOCOMPLETE ────────────────────────────────────────────────
const AC_FIELDS = ['producer','presenterVO','dop','ca','editor','afm'];

function getACValues(field) {
  // Collect all unique non-empty values for this field from current commissions
  const vals = new Set();
  comms.forEach(c => { if (c[field] && String(c[field]).trim()) vals.add(String(c[field]).trim()); });
  return Array.from(vals).sort();
}

function attachAutocomplete(inp, field) {
  if (!inp || inp.dataset.acAttached) return;
  inp.dataset.acAttached = '1';

  let dropEl = null;
  let selectedIdx = -1;

  function closeDrop() {
    if (dropEl) { dropEl.remove(); dropEl = null; }
    selectedIdx = -1;
  }

  function openDrop(matches) {
    closeDrop();
    if (!matches.length) return;
    const wrap = inp.closest('.ac-wrap') || inp.parentElement;
    dropEl = document.createElement('div');
    dropEl.className = 'ac-drop';
    matches.forEach((val, i) => {
      const item = document.createElement('div');
      item.className = 'ac-item';
      item.dataset.value = val;
      // Highlight the matching part
      const q = inp.value.trim();
      const idx = val.toLowerCase().indexOf(q.toLowerCase());
      if (idx >= 0) {
        item.innerHTML = esc(val.substring(0,idx)) + '<em>' + esc(val.substring(idx,idx+q.length)) + '</em>' + esc(val.substring(idx+q.length));
      } else {
        item.textContent = val;
      }
      item.addEventListener('mousedown', e => {
        e.preventDefault();
        inp.value = val;
        inp.dispatchEvent(new Event('input', {bubbles:true}));
        inp.dispatchEvent(new Event('blur', {bubbles:false}));
        closeDrop();
      });
      dropEl.appendChild(item);
    });
    // Position relative to input
    inp.parentElement.style.position = 'relative';
    inp.parentElement.appendChild(dropEl);
  }

  inp.addEventListener('input', () => {
    const q = inp.value.trim();
    if (!q) { closeDrop(); return; }
    const vals = getACValues(field);
    const matches = vals.filter(v => v.toLowerCase().includes(q.toLowerCase()) && v !== q);
    openDrop(matches.slice(0, 8));
    selectedIdx = -1;
  });

  inp.addEventListener('keydown', e => {
    if (!dropEl) return;
    const items = dropEl.querySelectorAll('.ac-item');
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      selectedIdx = Math.min(selectedIdx + 1, items.length - 1);
      items.forEach((el,i) => el.classList.toggle('selected', i === selectedIdx));
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      selectedIdx = Math.max(selectedIdx - 1, 0);
      items.forEach((el,i) => el.classList.toggle('selected', i === selectedIdx));
    } else if (e.key === 'Enter' && dropEl) {
      e.preventDefault();
      e.stopPropagation();
      // Use highlighted item, or first item if none highlighted
      const targetIdx = selectedIdx >= 0 ? selectedIdx : 0;
      const targetItem = items[targetIdx];
      if (targetItem) {
        inp.value = targetItem.dataset.value || targetItem.textContent.trim();
        inp.dispatchEvent(new Event('input',{bubbles:true}));
        closeDrop();
        updateComm(Number(inp.closest('tr[data-id]')?.dataset?.id), inp.dataset.field, inp.value);
        // Tab to next field
        setTimeout(()=>{
          const allInputs=Array.from(document.querySelectorAll('tr[data-id="'+inp.closest('tr[data-id]')?.dataset?.id+'"] input.ci:not([disabled])'));
          const ci=allInputs.indexOf(inp);
          const next=allInputs[ci+1];
          if(next){next.focus();next.select();}else{inp.blur();}
        }, 10);
      } else {
        closeDrop();
      }
    } else if (e.key === 'Escape') {
      closeDrop();
    }
  });

  inp.addEventListener('blur', () => {
    // Small delay so mousedown on item fires first
    setTimeout(closeDrop, 150);
  });

  inp.addEventListener('focus', () => {
    const q = inp.value.trim();
    if (q) {
      const vals = getACValues(field);
      const matches = vals.filter(v => v.toLowerCase().includes(q.toLowerCase()) && v !== q);
      openDrop(matches.slice(0, 8));
    }
  });
}

function attachLineupAutocomplete(inp, fieldName, epNum) {
  if(!inp||inp.dataset.acAttached)return;
  inp.dataset.acAttached='1';

  // Collect names from all relevant sources
  function getNames(){
    const vals=new Set();
    // From existing lineups (director/presenter1/presenter2 already saved)
    Object.values(lineups).forEach(lu=>{
      ['director','presenter1','presenter2'].forEach(f=>{if(lu[f]&&lu[f].trim())vals.add(lu[f].trim());});
    });
    // From commission list presenterVO, DOP, CA, editor
    comms.forEach(c=>{
      ['presenterVO','dop','ca','editor'].forEach(f=>{if(c[f]&&c[f].trim())vals.add(c[f].trim());});
    });
    // From studio crew (if available)
    Object.values(studioCrew||{}).forEach(ep=>{
      ['host1','host2','director','anchor'].forEach(f=>{if(ep[f]&&typeof ep[f]==='string'&&ep[f].trim())vals.add(ep[f].trim());});
    });
    // From users list
    (users||[]).forEach(u=>{if(u.displayName&&u.displayName.trim())vals.add(u.displayName.trim());});
    return Array.from(vals).sort();
  }

  // Field order for Enter-to-advance
  const fieldOrder=['director','presenter1','presenter2'];

  let dropEl=null,selectedIdx=-1;
  function closeDrop(){if(dropEl){dropEl.remove();dropEl=null;}selectedIdx=-1;}

  function openDrop(matches){
    closeDrop();
    if(!matches.length)return;
    const wrap=inp.parentElement;
    wrap.style.position='relative';
    dropEl=document.createElement('div');
    dropEl.className='ac-drop';
    matches.forEach((val,i)=>{
      const item=document.createElement('div');
      item.className='ac-item';
      item.dataset.value=val;
      const q=inp.value.trim();
      const idx=val.toLowerCase().indexOf(q.toLowerCase());
      if(idx>=0){
        item.innerHTML=esc(val.substring(0,idx))+'<em>'+esc(val.substring(idx,idx+q.length))+'</em>'+esc(val.substring(idx+q.length));
      } else {
        item.textContent=val;
      }
      item.addEventListener('mousedown',e=>{
        e.preventDefault();
        inp.value=val;
        inp.dispatchEvent(new Event('input',{bubbles:true}));
        closeDrop();
        advanceToNext();
      });
      dropEl.appendChild(item);
    });
    wrap.appendChild(dropEl);
  }

  function advanceToNext(){
    // Move focus to next field in director→pres1→pres2 order within the same episode block
    const currentOrder=fieldOrder.indexOf(fieldName);
    const nextField=fieldOrder[currentOrder+1];
    if(nextField){
      const epBlock=inp.closest('[data-lu-ep-block]');
      const nextInp=epBlock?.querySelector(`.lu-${nextField}`);
      if(nextInp){setTimeout(()=>{nextInp.focus();nextInp.select();},30);}
    }
  }

  inp.addEventListener('input',()=>{
    const q=inp.value.trim();
    if(!q){closeDrop();return;}
    const matches=getNames().filter(v=>v.toLowerCase().includes(q.toLowerCase())&&v!==q);
    openDrop(matches.slice(0,8));
    selectedIdx=-1;
  });

  inp.addEventListener('keydown',e=>{
    if(e.key==='ArrowDown'){
      e.preventDefault();
      if(!dropEl)return;
      const items=dropEl.querySelectorAll('.ac-item');
      selectedIdx=Math.min(selectedIdx+1,items.length-1);
      items.forEach((el,i)=>el.classList.toggle('selected',i===selectedIdx));
      return;
    }
    if(e.key==='ArrowUp'){
      e.preventDefault();
      if(!dropEl)return;
      const items=dropEl.querySelectorAll('.ac-item');
      selectedIdx=Math.max(selectedIdx-1,0);
      items.forEach((el,i)=>el.classList.toggle('selected',i===selectedIdx));
      return;
    }
    if(e.key==='Enter'){
      e.preventDefault();
      if(dropEl){
        const items=dropEl.querySelectorAll('.ac-item');
        const targetIdx=selectedIdx>=0?selectedIdx:0;
        const target=items[targetIdx];
        if(target){
          inp.value=target.dataset.value||target.textContent.trim();
          inp.dispatchEvent(new Event('input',{bubbles:true}));
          closeDrop();
        } else {
          closeDrop();
        }
      }
      advanceToNext();
      return;
    }
    if(e.key==='Escape'){closeDrop();}
  });

  inp.addEventListener('blur',()=>setTimeout(closeDrop,250));
  inp.addEventListener('focus',()=>{
    const q=inp.value.trim();
    if(q){
      const matches=getNames().filter(v=>v.toLowerCase().includes(q.toLowerCase())&&v!==q);
      openDrop(matches.slice(0,8));
    }
  });
}

function attachStudioAutocomplete(inp, field) {
  if(inp.dataset.acAttached)return;
  inp.dataset.acAttached='1';
  let dropEl=null,selectedIdx=-1;
  function closeDrop(){if(dropEl){dropEl.remove();dropEl=null;}selectedIdx=-1;}
  function openDrop(matches){
    closeDrop();if(!matches.length)return;
    dropEl=document.createElement('div');dropEl.className='ac-drop';
    matches.forEach((val,i)=>{
      const item=document.createElement('div');item.className='ac-item';
      const q=inp.value.trim();const idx=val.toLowerCase().indexOf(q.toLowerCase());
      if(idx>=0){item.innerHTML=esc(val.substring(0,idx))+'<em>'+esc(val.substring(idx,idx+q.length))+'</em>'+esc(val.substring(idx+q.length));}
      else{item.textContent=val;}
      item.addEventListener('mousedown',e=>{
        e.preventDefault();
        inp.value=val;
        inp.dispatchEvent(new Event('input',{bubbles:true}));
        // Save and stay in field
        const ep=inp.dataset.ep;
        if(ep){
          if(!studioCrew[ep])studioCrew[ep]={};
          studioCrew[ep][inp.dataset.field]=val;
          saveStudioCrew(ep,studioCrew[ep]);
        } else {
          inp.dispatchEvent(new Event('blur',{bubbles:false}));
        }
        closeDrop();
        setTimeout(()=>{inp.focus();inp.select();},10);
      });
      dropEl.appendChild(item);
    });
    // Attach to the input's parent div (the relative-positioned wrapper)
    const wrapper=inp.parentElement;
    wrapper.style.position='relative';
    wrapper.appendChild(dropEl);
  }
  inp.addEventListener('input',()=>{
    const q=inp.value.trim();
    if(!q){closeDrop();return;}
    const vals=getStudioACValues(field);
    openDrop(vals.filter(v=>v.toLowerCase().includes(q.toLowerCase())&&v!==q).slice(0,8));
    selectedIdx=-1;
  });
  inp.addEventListener('keydown',e=>{
    // Tab — save and move to next studio field
    if(e.key==='Tab'){
      e.preventDefault();
      closeDrop();
      const ep=inp.dataset.ep;
      if(!studioCrew[ep])studioCrew[ep]={};
      studioCrew[ep][field]=inp.value;
      saveStudioCrew(ep,studioCrew[ep]);
      const allStudio=Array.from(document.querySelectorAll('input.studio-ci'));
      const idx=allStudio.indexOf(inp);
      const next=allStudio[idx+(e.shiftKey?-1:1)];
      if(next){next.focus();next.select();}
      return;
    }
    // Enter — select autocomplete item or save and stay in field
    if(e.key==='Enter'){
      e.preventDefault();
      e.stopPropagation();
      if(dropEl){
        const items=dropEl.querySelectorAll('.ac-item');
        // If an item is highlighted use it; otherwise use first visible item
        const targetIdx=selectedIdx>=0?selectedIdx:0;
        if(items[targetIdx]){
          inp.value=items[targetIdx].dataset.value||items[targetIdx].textContent.trim();
          inp.dispatchEvent(new Event('input',{bubbles:true}));
        }
        closeDrop();
      }
      // Save and stay in field
      const ep=inp.dataset.ep;
      if(!studioCrew[ep])studioCrew[ep]={};
      studioCrew[ep][field]=inp.value;
      saveStudioCrew(ep,studioCrew[ep]);
      setTimeout(()=>{inp.focus();inp.select();},10);
      return;
    }
    if(!dropEl)return;
    const items=dropEl.querySelectorAll('.ac-item');
    if(e.key==='ArrowDown'){e.preventDefault();selectedIdx=Math.min(selectedIdx+1,items.length-1);items.forEach((el,i)=>el.classList.toggle('selected',i===selectedIdx));}
    else if(e.key==='ArrowUp'){e.preventDefault();selectedIdx=Math.max(selectedIdx-1,0);items.forEach((el,i)=>el.classList.toggle('selected',i===selectedIdx));}
    else if(e.key==='Escape'){closeDrop();}
  });
  inp.addEventListener('blur',()=>setTimeout(closeDrop,150));
  inp.addEventListener('focus',()=>{
    const q=inp.value.trim();
    if(q){const vals=getStudioACValues(field);openDrop(vals.filter(v=>v.toLowerCase().includes(q.toLowerCase())&&v!==q).slice(0,8));}
  });
}

function attachAllAutocomplete() {
  AC_FIELDS.forEach(field => {
    document.querySelectorAll(`input.ci[data-field="${field}"]`).forEach(inp => {
      attachAutocomplete(inp, field);
    });
  });
}

    // Snap to end of that month
    cur.setUTCMonth(cur.getUTCMonth()+1);
    cur.setUTCDate(0);
    PRES_CAL_END=cur.toISOString().split('T')[0];
    // Persist to Firebase
    try{setDoc(doc(db,'settings','presCalEnd'),{endDate:PRES_CAL_END});}catch(err){console.warn('presCalEnd save:',err);}
    // Jump to the newly added months
    const newMonths=Object.keys(presCalDates().reduce((a,d)=>{a[presCalMonth(d)]=1;return a},{}));
    presCalViewMonth=newMonths.length-3;
    render();
    showToast('Calendar extended to '+presCalFmt(PRES_CAL_END));
  }
});

// Presenter calendar dropdown (delegated)
document.addEventListener('change',function presCalHandler(e){
  const sel=e.target.closest('.pres-cal-sel');
  if(!sel)return;
  const dateStr=sel.dataset.date;
  const presKey=sel.dataset.pres;
  const val=sel.value;
  if(!presCalData[dateStr])presCalData[dateStr]={};
  if(!val){
    delete presCalData[dateStr][presKey];
  } else if(val==='na'){
    presCalData[dateStr][presKey]={notAvailable:true};
  } else if(val==='studio'){
    presCalData[dateStr][presKey]={studio:true};
  } else if(val==='custom'){
    const note=prompt('Enter a note for this day:');
    if(note===null){sel.value='';return;} // cancelled
    presCalData[dateStr][presKey]={custom:true,customNote:note.trim()||'Note'};
  } else {
    const comm=comms.find(c=>c.commNum===val);
    presCalData[dateStr][presKey]={commNum:val,storyName:comm?.storyName||'',producer:comm?.producer||''};
  }
  savePresCalDay(dateStr,presCalData[dateStr]);
  // Update just this cell in-place — don't re-render entire page
  updatePresCalCell(dateStr,presKey,presCalData[dateStr][presKey]||{});
});

// Update a single presenter calendar cell without full re-render
function updatePresCalCell(dateStr,presKey,cell){
  const sel=document.querySelector(`.pres-cal-sel[data-date="${dateStr}"][data-pres="${presKey}"]`);
  if(!sel)return;
  const td=sel.parentElement;
  if(!td)return;
  // Remove existing badges and old clear buttons
  td.querySelectorAll('[data-pres-badge],.pres-cal-clear').forEach(el=>el.remove());
  const hasContent=cell.notAvailable||cell.studio||cell.custom||cell.commNum;
  if(hasContent){
    const badge=document.createElement('div');
    badge.setAttribute('data-pres-badge','1');
    badge.title='Click to edit or remove';
    badge.style.cursor='pointer';
    if(cell.notAvailable){
      badge.style.cssText='background:#2d0a0a;border-radius:4px;padding:5px 8px;font-size:11px;font-weight:700;color:#f85149;text-align:center;margin-bottom:2px;cursor:pointer';
      badge.textContent='NOT AVAILABLE';
    } else if(cell.studio){
      badge.style.cssText='background:#1a2d4a;border-radius:4px;padding:5px 8px;font-size:11px;font-weight:700;color:#7a3fbf;text-align:center;margin-bottom:2px;cursor:pointer';
      badge.textContent='STUDIO';
    } else if(cell.custom){
      badge.style.cssText='background:#2d2a1a;border-radius:4px;padding:5px 8px;font-size:11px;font-weight:700;color:#e3b341;word-break:break-word;margin-bottom:2px;cursor:pointer';
      badge.textContent=cell.customNote||'Note';
    } else if(cell.commNum){
      badge.style.cssText='background:#1a2d4a;border-radius:4px;padding:5px 8px;margin-bottom:2px;cursor:pointer';
      badge.innerHTML=`<div style="font-size:11px;font-weight:900;color:#58a6ff;font-family:monospace">${cell.commNum}</div>`+
        (cell.storyName?`<div style="font-size:10px;color:#9aaabe;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:130px">${cell.storyName}</div>`:'')+
        (cell.producer?`<div style="font-size:10px;color:#6e7681;margin-top:2px">${cell.producer}</div>`:'');
    }
    td.insertBefore(badge,sel);
    sel.style.display='none';
  } else {
    sel.style.display='block';
    sel.value='';
  }
}

function luFlushFields(){

document.addEventListener('click',function luHeaderToggle(e){
  const hdr=e.target.closest('.lu-ep-header');
  if(!hdr)return;
  if(e.target.closest('button,input,select'))return;
  const ep=String(hdr.dataset.luEp);

  // Flush any pending saves for director/presenter before toggling
  ['director','presenter1','presenter2'].forEach(f=>{
    clearTimeout(window['_luSave_'+ep]);
  });
  if(lineups[ep])saveLineup(ep,lineups[ep]);

  if(luCollapsed.has(ep)){
    luCollapsed.delete(ep);
  } else {
    // Before collapsing, capture current input values into lineups state
    const block=document.querySelector(`[data-lu-ep-block="${ep}"]`);
    if(block){
      ['director','presenter1','presenter2'].forEach(f=>{
        const inp=block.querySelector(`.lu-${f}`);
        if(inp&&lineups[ep])lineups[ep][f]=inp.value;
      });
      if(lineups[ep])saveLineup(ep,lineups[ep]);
    }
    luCollapsed.add(ep);
  }

  // ── Targeted DOM swap — no scroll jump ──
  const block=document.querySelector(`[data-lu-ep-block="${ep}"]`);
  if(!block){render();return;}

  const isNowCollapsed=luCollapsed.has(ep);
  const role=getEffectiveRole();
  const canEdit=['admin','operations','production','prodmgmt','editorial'].includes(role);
  const past=block.querySelector('.lu-ep-header')?.style.background?.includes('2d0f0f')||
              block.dataset.luPast==='1';

  // Update chevron
  const chevron=block.querySelector('.lu-chevron');
  if(chevron)chevron.textContent=isNowCollapsed?'▶':'▼';

  // Update title attribute
  const hdrEl=block.querySelector('.lu-ep-header');
  if(hdrEl)hdrEl.title=isNowCollapsed?'Click to expand':'Click to collapse';

  // Toggle body visibility
  const body=block.querySelector('.lu-ep-body');
  if(body){
    body.style.display=isNowCollapsed?'none':'block';
  }
});

// Live duration update — recalculate ep durations on input
document.addEventListener('input',function rosDurInput(e){
  if(!e.target.classList.contains('ros-dur')&&!e.target.classList.contains('ros-content'))return;
  if(!e.target.classList.contains('ros-dur'))return;
  // Recalculate episode durations live
  const allDurInputs=Array.from(document.querySelectorAll('.ros-dur'));
  const allEpDurCells=Array.from(document.querySelectorAll('.ros-epdur'));
  const durs=allDurInputs.map(inp=>rosDurToSecs(inp.value));
  // Also grab fixed item durations from the table (from spans, not inputs)
  // Build full duration array from both inputs and locked cells
  const rows=document.querySelectorAll('tbody tr');
  const allSecs=Array.from(rows).map((tr,i)=>{
    const durInp=tr.querySelector('.ros-dur');
    const durSpan=tr.querySelectorAll('td')[2]?.querySelector('span');
    return rosDurToSecs(durInp?durInp.value:durSpan?durSpan.textContent:'');
  });
  const total=allSecs.reduce((s,v)=>s+v,0);
  allEpDurCells.forEach((cell,i)=>{
    const fromHere=allSecs.slice(i).reduce((s,v)=>s+v,0);
    cell.textContent=fromHere?rosSecsToStr(fromHere):'—';
  });
  // Update total in header
  const totalEl=document.querySelector('#ros-total');
  if(totalEl)totalEl.textContent='Total: '+rosSecsToStr(total);
});

// Week navigation
document.addEventListener('click',function ppNavHandler(e){
  if(e.target.id==='pp-prev-week'){ppWeekOffset--;render();return;}
  if(e.target.id==='pp-next-week'){ppWeekOffset++;render();return;}
  if(e.target.id==='pp-today-week'){
    // Find which week offset contains today
    const today=new Date().toISOString().split('T')[0];
    const p=PP_SEASON_START.split('-');
    const start=new Date(Date.UTC(+p[0],+p[1]-1,+p[2]));
    const todayD=new Date(today+'T00:00:00Z');
    const diffDays=Math.floor((todayD-start)/(1000*60*60*24));
    ppWeekOffset=Math.floor(diffDays/7);
    if(ppWeekOffset<0)ppWeekOffset=0;
    render();return;
  }
});

  }
});
// Also protect pp-cell inputs from onSnapshot render wipe (add to existing check)
// ── One-time global handlers (set up once, survive renders) ─────
document.addEventListener('click',function epToggleHandler(e){
  // Expand All button
  if(e.target.closest('#ep-expand-all-btn')){
    const epNums=getEpNums();
    if(expandedEps.size===epNums.length){expandedEps.clear();}
    else{epNums.forEach(n=>expandedEps.add(String(n)));}
    render();return;
  }
  // Episode card header toggle
  const header=e.target.closest('[data-ep-toggle]');
  if(!header)return;
  if(e.target.closest('.type-toggle,.ep-date-btn,.ep-date-inp,.add-row-btn,button,select,input,a'))return;
  e.stopPropagation();
  const ep=String(header.dataset.epToggle);
  if(expandedEps.has(ep))expandedEps.delete(ep);
  else expandedEps.add(ep);
  render();
});

async function boot(){
  // Try stored config first, fall back to baked-in config
  let cfg=getCfg();
  if(!cfg){
    cfg=BAKED_CONFIG;
    saveCfg(cfg);
  }
  if(cfg){const ok=initFB(cfg);if(!ok){localStorage.removeItem(STORAGE_KEY);render();return;}}
  render();
  if(!auth)return;
  onAuthStateChanged(auth,async user=>{
    if(user){
      currentUser=user;
      try{
        // Check Firestore role first, fall back to hardcoded admin email
        const firestoreRole=await getUserRole(user.uid);
        if(firestoreRole){
          currentRole=firestoreRole;
        } else if(user.email===ADMIN_EMAIL){
          currentRole='admin';
          await setDoc(doc(db,'users',user.uid),{email:user.email,displayName:user.displayName||user.email,role:'admin',createdAt:serverTimestamp()});
        } else {
          currentRole='editorial';
        }
      }catch(e){
        console.error('Role error:',e);
        currentRole=user.email===ADMIN_EMAIL?'admin':'editorial';
      }
      try{subscribeData();}catch(e){console.error('Subscribe error:',e);}
      try{await loadUsers();}catch(e){console.error('Load users error:',e);}
      try{await loadStudioCrew();}catch(e){console.error('Studio crew error:',e);}
      try{await loadEndCredits();}catch(e){console.error('End credits error:',e);}
      try{await loadPromoData();}catch(e){console.error('Promo data error:',e);}
      try{await loadUIDPool();}catch(e){console.error('UID pool error:',e);}
      try{await loadMusicCues();}catch(e){console.error('Music cues error:',e);}
      try{await loadDeliverables();}catch(e){console.error('Deliverables error:',e);}
      try{await loadDeliverables();}catch(e){console.error('Deliverables error:',e);}
      try{await loadLeaveRequests();}catch(e){console.error('Leave requests error:',e);}
      try{await loadPresCal();}catch(e){console.error('Presenter calendar error:',e);}
      try{await loadLineups();}catch(e){console.error('Lineup load error:',e);}
      try{await loadPostProd();}catch(e){console.error('Post prod load error:',e);}
      try{await loadROS();}catch(e){console.error('ROS load error:',e);}
      try{await loadLeaveBalances();}catch(e){console.error('Leave balances error:',e);}
      render();
    } else {
      currentUser=null;currentRole=null;
      if(unsubComms){unsubComms();unsubComms=null;}
      if(unsubSettings){unsubSettings();unsubSettings=null;}
      render();
    }
  });
}
boot();
</script>
